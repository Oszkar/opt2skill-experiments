ion, object location, desk height, contact force. Each stored trajectory carries joint positions and velocities, base pose and twist, end-effector positions, <strong>joint torques<\/strong> and <strong>contact forces<\/strong>.<\/p>\n\n<p>Two purposes are served at once. The obvious one: coverage, so the policy sees a family of motions rather than one. The subtler one: the randomization ranges <em>define the task<\/em>. A policy is only ever as general as the parameter box its references were drawn from, and that box is a design decision made here, upstream of any learning.<\/p>\n\n<h3>The generator as a rejection pipeline<\/h3>\n<figure>\n<svg sc-camel-view-box=\"0 0 672 168\" width=\"100%\" role=\"img\" aria-label=\"Sample, solve, export, filter, validate, save state machine\">\n<g font-family=\"Archivo, sans-serif\">\n<g fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2\">\n<rect x=\"0\" y=\"22\" width=\"96\" height=\"52\"><\/rect><rect x=\"114\" y=\"22\" width=\"96\" height=\"52\"><\/rect><rect x=\"228\" y=\"22\" width=\"96\" height=\"52\"><\/rect><rect x=\"342\" y=\"22\" width=\"112\" height=\"52\"><\/rect><rect x=\"472\" y=\"22\" width=\"112\" height=\"52\"><\/rect><rect x=\"602\" y=\"22\" width=\"70\" height=\"52\"><\/rect>\n<\/g>\n<rect x=\"602\" y=\"22\" width=\"70\" height=\"4\" fill=\"#ec3013\"><\/rect>\n<g font-size=\"11\" font-weight=\"800\" fill=\"#201e1d\">\n<text x=\"12\" y=\"44\">Sample<\/text><text x=\"126\" y=\"44\">Solve<\/text><text x=\"240\" y=\"44\">Export<\/text><text x=\"354\" y=\"44\">Filter<\/text><text x=\"484\" y=\"44\">Validate<\/text><text x=\"614\" y=\"44\">Save<\/text>\n<\/g>\n<g font-size=\"9.5\" fill=\"#605d5d\">\n<text x=\"12\" y=\"60\">params<\/text><text x=\"126\" y=\"60\">BoxFDDP<\/text><text x=\"240\" y=\"60\">convert units<\/text><text x=\"354\" y=\"60\">9 feasibility<\/text><text x=\"354\" y=\"70\">checks<\/text><text x=\"484\" y=\"60\">inverse dyn.<\/text><text x=\"484\" y=\"70\">+ replay<\/text><text x=\"614\" y=\"60\">.npz<\/text>\n<\/g>\n<g stroke=\"#201e1d\" stroke-width=\"2\"><path d=\"M96 48 h11 M210 48 h11 M324 48 h11 M454 48 h11 M584 48 h11\"><\/path><\/g>\n<g fill=\"#201e1d\"><path d=\"M114 48 l-8 -4 v8 z\"><\/path><path d=\"M228 48 l-8 -4 v8 z\"><\/path><path d=\"M342 48 l-8 -4 v8 z\"><\/path><path d=\"M472 48 l-8 -4 v8 z\"><\/path><path d=\"M602 48 l-8 -4 v8 z\"><\/path><\/g>\n<g stroke=\"#ec3013\" stroke-width=\"2\" stroke-dasharray=\"4 3\" fill=\"none\"><path d=\"M162 74 v26 M398 74 v26 M528 74 v26\"><\/path><\/g>\n<g fill=\"#ec3013\"><path d=\"M162 100 l-4 -8 h8 z\" transform=\"translate(0,8) rotate(180 162 96)\"><\/path><\/g>\n<line x1=\"0\" y1=\"104\" x2=\"672\" y2=\"104\" stroke=\"#ec3013\" stroke-width=\"2\"><\/line>\n<text x=\"0\" y=\"122\" font-size=\"10.5\" font-weight=\"800\" fill=\"#ae1800\" letter-spacing=\"0.05em\">REJECTED — LOGGED WITH ITS PARAMETERS AND THE STAGE THAT KILLED IT, THEN RESAMPLED<\/text>\n<text x=\"0\" y=\"142\" font-size=\"10\" fill=\"#605d5d\">The rejection log is a dataset in its own right: it tells you which gate does the work, and where the parameter box exceeds the robot.<\/text>\n<line x1=\"0\" y1=\"158\" x2=\"672\" y2=\"158\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<\/g>\n<\/svg>\n<figcaption>Fig. 11 — Our G1 generation and validation pipeline uses sample-and-reject with logged failure stages. BoxFDDP, the nine checks, replay gates, and NPZ export are implementation details, not documented Opt2Skill pipeline stages.<\/figcaption>\n<\/figure>\n\n<h3>What a feasibility filter should check<\/h3>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:30%\">Check<\/sc-raw-th><sc-raw-th style=\"width:26%\">Catches<\/sc-raw-th><sc-raw-th>Typical bound<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Torque headroom<\/sc-raw-td><sc-raw-td>Solutions that only exist at the actuator limit<\/sc-raw-td><sc-raw-td>peak &lt; 0.9 × effort limit<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Joint-limit margin<\/sc-raw-td><sc-raw-td>Barrier cost losing to a stronger cost<\/sc-raw-td><sc-raw-td>&gt; 0.02 rad inside<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Normal force, friction use, CoP<\/sc-raw-td><sc-raw-td>Physically impossible ground reaction<\/sc-raw-td><sc-raw-td>f_z &gt; 20 N, |f_t|/μf_n &lt; 0.9, CoP 5 mm inside sole<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Contact drift<\/sc-raw-td><sc-raw-td>Integrator error accumulating in the pinned foot<\/sc-raw-td><sc-raw-td>&lt; 3 mm / 3 mrad<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Task success + terminal rest<\/sc-raw-td><sc-raw-td>The motion not actually doing the task<\/sc-raw-td><sc-raw-td>depth error &lt; 1 cm, final joint speed &lt; 0.05 rad/s<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Cross-model inverse dynamics<\/sc-raw-td><sc-raw-td>The two rigid-body models disagreeing<\/sc-raw-td><sc-raw-td>joint residual rms &lt; 0.01 N·m<\/sc-raw-td><\/sc-raw-tr>\n<\/sc-raw-tbody>\n<\/sc-raw-table>\n\n<div class=\"poc\">\n<div class=\"kicker\">PoC · your measured run<\/div>\n<p style=\"margin-bottom:0\">100 accepted from 109 attempts (0.92), mean solve 1.9&nbsp;s, wall time 227&nbsp;s, depth histogram 20/25/31/24 over 0.10–0.30&nbsp;m, split 70/10/20. All nine rejects were filter-stage (seven foot drift, one depth, one CoP), zero inverse-dynamics. Read that as: your OCP formulation is sound and your <em>parameter box is slightly too ambitious at the deep end<\/em> — every reject was a deep squat. That is exactly the diagnostic the rejection log exists to give you.<\/p>\n<\/div>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>How do reference coverage, environment randomization, observations and rewards jointly affect generalization?<\/li>\n<li>Why filter at all — the optimizer already had constraints?<\/li>\n<li>Your rejects cluster at one end of the parameter box. Name two different responses and when each is right.<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 6<\/div>\n<h2>The handoff contract: where correct pipelines quietly break<\/h2>\n\n<p>Between optimizer and simulator sit two rigid-body libraries that describe the same robot in different words. Nothing in this section is intellectually deep and all of it is where days go. Treat every one of these as part of the data's <em>type<\/em>.<\/p>\n\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:20%\">Quantity<\/sc-raw-th><sc-raw-th style=\"width:32%\">Optimizer side (Pinocchio)<\/sc-raw-th><sc-raw-th style=\"width:30%\">Simulator side (MuJoCo)<\/sc-raw-th><sc-raw-th>Conversion<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Base orientation<\/sc-raw-td><sc-raw-td>quaternion x y z w<\/sc-raw-td><sc-raw-td>quaternion w x y z<\/sc-raw-td><sc-raw-td>reorder<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Base linear velocity<\/sc-raw-td><sc-raw-td>body frame<\/sc-raw-td><sc-raw-td>world frame<\/sc-raw-td><sc-raw-td>rotate by R(quat)<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Base angular velocity<\/sc-raw-td><sc-raw-td>body frame<\/sc-raw-td><sc-raw-td>body frame<\/sc-raw-td><sc-raw-td>none — and this asymmetry is the trap<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Joint torque<\/sc-raw-td><sc-raw-td><code>u<\/code>, no passive damping<\/sc-raw-td><sc-raw-td>actuator must also fight damping<\/sc-raw-td><sc-raw-td>τ = u + b·q̇<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Contact<\/sc-raw-td><sc-raw-td>rigid constraint, force from KKT<\/sc-raw-td><sc-raw-td>soft contact, force from penetration<\/sc-raw-td><sc-raw-td>no conversion — a genuine model gap<\/sc-raw-td><\/sc-raw-tr>\n<\/sc-raw-tbody>\n<\/sc-raw-table>\n\n\n<h3>The scene in simulation<\/h3>\n<p>Side view, not to scale. Two different things live at the sole point: the optimizer's contact constraint (a frame pinned in place) and MuJoCo's contact geometry (a box the floor pushes on). The config's <code>sole_offset<\/code> makes them coincide, and the foot-geometry reconciliation check proves it.<\/p>\n<figure>\n<svg sc-camel-view-box=\"0 0 672 310\" width=\"100%\" role=\"img\" aria-label=\"Side view of one leg standing on the floor with frames, contact box, sole point and ground reaction force annotated\">\n<g font-family=\"Archivo, sans-serif\">\n<line x1=\"120\" y1=\"250\" x2=\"660\" y2=\"250\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<path d=\"M134 250 l-8 10 M160 250 l-8 10 M186 250 l-8 10 M212 250 l-8 10 M238 250 l-8 10 M264 250 l-8 10 M290 250 l-8 10 M316 250 l-8 10 M342 250 l-8 10 M368 250 l-8 10 M394 250 l-8 10 M420 250 l-8 10 M446 250 l-8 10 M472 250 l-8 10 M498 250 l-8 10 M524 250 l-8 10 M550 250 l-8 10 M576 250 l-8 10 M602 250 l-8 10 M628 250 l-8 10 \" stroke=\"#a19c9c\" stroke-width=\"1\" fill=\"none\"><\/path>\n<g stroke=\"#201e1d\" stroke-width=\"1.5\" fill=\"none\"><path d=\"M40 250 V172 M40 250 H108\"><\/path><\/g>\n<g fill=\"#201e1d\"><path d=\"M40 166 l-4 8 h8 z\"><\/path><path d=\"M114 250 l-8 -4 v8 z\"><\/path><\/g>\n<text x=\"47\" y=\"178\" font-size=\"10\" fill=\"#201e1d\">z<\/text><text x=\"82\" y=\"266\" font-size=\"10\" fill=\"#201e1d\">x (forward)<\/text>\n<g font-size=\"10\" fill=\"#605d5d\"><text x=\"0\" y=\"44\">Soft contact: 1.2 mm of penetration at the home<\/text><text x=\"0\" y=\"57\">keyframe already produces about 78 N, so the<\/text><text x=\"0\" y=\"70\">standing state is lifted until the soles sit<\/text><text x=\"0\" y=\"83\">exactly on z = 0 before the replay begins.<\/text><\/g>\n<circle cx=\"340\" cy=\"30\" r=\"10\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2\"><\/circle>\n<line x1=\"340\" y1=\"40\" x2=\"340\" y2=\"71\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<rect x=\"326\" y=\"71\" width=\"28\" height=\"18\" fill=\"#201e1d\"><\/rect>\n<polyline points=\"340,96 350,165 344,232\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\/polyline>\n<circle cx=\"340\" cy=\"96\" r=\"4.5\" fill=\"#201e1d\"><\/circle>\n<circle cx=\"350\" cy=\"165\" r=\"4\" fill=\"#f3f2f2\" stroke=\"#201e1d\" stroke-width=\"2\"><\/circle>\n<circle cx=\"344\" cy=\"232\" r=\"4\" fill=\"#f3f2f2\" stroke=\"#201e1d\" stroke-width=\"2\"><\/circle>\n<path d=\"M338 104 l6 -6 l6 6 l-6 6 z\" fill=\"#ec3013\"><\/path>\n<rect x=\"306\" y=\"238\" width=\"100\" height=\"12\" fill=\"#d7d3d3\" stroke=\"#201e1d\" stroke-width=\"1.5\"><\/rect>\n<path d=\"M344 232 L362 250\" stroke=\"#605d5d\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\/path>\n<line x1=\"362\" y1=\"246\" x2=\"362\" y2=\"152\" stroke=\"#ec3013\" stroke-width=\"2.5\"><\/line>\n<path d=\"M362 146 l-5 10 h10 z\" fill=\"#ec3013\"><\/path>\n<circle cx=\"362\" cy=\"250\" r=\"4.5\" fill=\"#ec3013\"><\/circle>\n<g font-size=\"10.5\" fill=\"#201e1d\"><text x=\"252\" y=\"99\">hip (3 dof)<\/text><text x=\"304\" y=\"169\">knee<\/text><text x=\"212\" y=\"228\">ankle roll link origin<\/text><\/g>\n<text x=\"366\" y=\"78\" font-size=\"10.5\" font-weight=\"800\" fill=\"#201e1d\">pelvis frame<\/text>\n<text x=\"366\" y=\"91\" font-size=\"9.5\" fill=\"#605d5d\" font-family=\"ui-monospace, Menlo, monospace\">qpos[0:3] pos · qpos[3:7] quat wxyz · z = 0.785 at home<\/text>\n<text x=\"366\" y=\"112\" font-size=\"10.5\" fill=\"#201e1d\">CoM · 33.34 kg · 0.72 m above the floor at stand<\/text>\n<g font-size=\"10\" fill=\"#605d5d\"><text x=\"480\" y=\"134\">second foot 0.2 m to the side,<\/text><text x=\"480\" y=\"146\">hidden in this view<\/text><\/g>\n<text x=\"376\" y=\"160\" font-size=\"10.5\" font-weight=\"800\" fill=\"#ae1800\">f = (fx, fy, fz) — fz ≈ +163 N per foot at rest<\/text>\n<text x=\"376\" y=\"174\" font-size=\"10.5\" fill=\"#201e1d\">τ = (tx, ty, tz) — small<\/text>\n<text x=\"376\" y=\"188\" font-size=\"9.5\" fill=\"#201e1d\" font-family=\"ui-monospace, Menlo, monospace\">CoP = (−ty / fz, tx / fz) must stay inside the sole box<\/text>\n<g font-size=\"10\" fill=\"#201e1d\"><text x=\"414\" y=\"216\">MuJoCo foot geom: box, half-size (0.09, 0.03, 0.008)<\/text><text x=\"414\" y=\"228\">at (0.04, 0, −0.029) in the ankle roll link<\/text><\/g>\n<g font-size=\"10\" fill=\"#ae1800\"><text x=\"372\" y=\"270\">sole frame = ankle origin + (0.04, 0, −0.037)<\/text><text x=\"372\" y=\"282\">optimizer contact frame and origin of foot_wrench_*<\/text><\/g>\n<text x=\"0\" y=\"302\" font-size=\"10\" fill=\"#605d5d\">world frame · floor plane z = 0 · scene friction 1.0 (the optimizer planned with 0.6)<\/text>\n<\/g>\n<\/svg>\n<figcaption>Fig. 12 — <strong>What to see.<\/strong> Weight 327 N splits to about 163 N per foot at rest. The grey box is what MuJoCo collides; the red point is where Crocoddyl applied its constraint and where the file's wrench is expressed. They differ by 8 mm vertically on purpose: the sole is the bottom face of the box. The friction mismatch is deliberate too — the nominal simulator has a higher friction coefficient than the optimizer, but this alone does not guarantee successful contact tracking, and the policy's friction randomisation U[0.3, 1.0] (section 9) later takes it below the planned value.<\/figcaption>\n<\/figure>\n\n<h3>Frame and layout conventions, as the export applies them<\/h3>\n<pre>                Pinocchio (optimizer)               MuJoCo (simulator)\nq / qpos [0:3]  base position, world                base position, world\n         [3:7]  quaternion  x y z w                 quaternion  w x y z           <b>&lt;- reorder<\/b>\n         [7:36] 29 joints, same order               29 joints, same order\nv / qvel [0:3]  base linear vel, BODY frame         base linear vel, WORLD        <b>&lt;- rotate by R(quat)<\/b>\n         [3:6]  base angular vel, BODY frame        base angular vel, BODY        <i>(same)<\/i>\n         [6:35] 29 joint velocities                 29 joint velocities           <i>(same)<\/i>\ntorque          u, 29, no damping                   tau, 29, includes damping     <b>&lt;- add b · qdot<\/b>\ncontact         wrench at sole frame,               foot_wrench_*, same point,    <i>(same)<\/i>\n                LOCAL_WORLD_ALIGNED                 world axes at the sole origin\n---------------------------------------------------------------------------------------------\nkeypoints in the file (com excepted) are pelvis-local:   p_local = R(quat)ᵀ (p_world − pelvis_pos)\npelvis_linvel in the file is pelvis-local (policy convention); qvel[0:3] is world (MuJoCo convention).<\/pre>\n<p style=\"font-size:12.5px;color:var(--color-neutral-700)\">Reconciliation proves the middle column: identical joint names and order, equal joint limits after the hip-roll override, equal masses and inertias, equal forward kinematics on random poses, and the foot box where the config says.<\/p>\n<h3>The timing contract<\/h3>\n<figure>\n<svg sc-camel-view-box=\"0 0 672 148\" width=\"100%\" role=\"img\" aria-label=\"Snapshots at nodes, torques over intervals\">\n<g font-family=\"Archivo, sans-serif\">\n<g stroke=\"#201e1d\" stroke-width=\"2\"><path d=\"M40 44 h560\"><\/path><\/g>\n<g fill=\"#201e1d\"><circle cx=\"40\" cy=\"44\" r=\"5\"><\/circle><circle cx=\"180\" cy=\"44\" r=\"5\"><\/circle><circle cx=\"320\" cy=\"44\" r=\"5\"><\/circle><circle cx=\"460\" cy=\"44\" r=\"5\"><\/circle><circle cx=\"600\" cy=\"44\" r=\"5\"><\/circle><\/g>\n<g font-size=\"11\" font-weight=\"800\" fill=\"#201e1d\"><text x=\"32\" y=\"30\">k=0<\/text><text x=\"172\" y=\"30\">1<\/text><text x=\"312\" y=\"30\">2<\/text><text x=\"452\" y=\"30\">…<\/text><text x=\"588\" y=\"30\">N<\/text><\/g>\n<text x=\"0\" y=\"48\" font-size=\"10.5\" font-weight=\"800\" fill=\"#605d5d\">STATE<\/text>\n<g stroke=\"#ec3013\" stroke-width=\"8\" stroke-linecap=\"butt\"><path d=\"M48 84 h124\"><\/path><path d=\"M188 84 h124\"><\/path><path d=\"M328 84 h124\"><\/path><path d=\"M468 84 h124\"><\/path><\/g>\n<text x=\"0\" y=\"88\" font-size=\"10.5\" font-weight=\"800\" fill=\"#ae1800\">TORQUE<\/text>\n<g font-size=\"10\" fill=\"#605d5d\"><text x=\"90\" y=\"106\">τ[0]<\/text><text x=\"230\" y=\"106\">τ[1]<\/text><text x=\"370\" y=\"106\">τ[2]<\/text><text x=\"510\" y=\"106\">τ[N−1]<\/text><\/g>\n<line x1=\"0\" y1=\"120\" x2=\"672\" y2=\"120\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<text x=\"0\" y=\"140\" font-size=\"11\" fill=\"#201e1d\">N+1 snapshots, N intervals. Interval k <\/text><\/g><\/svg><strong>starts<\/strong> at state k, is driven by τ[k] for the whole step, and <strong>ends<\/strong> at state k+1. State N carries no torque.\n\n\n<figcaption>Fig. 13 — Off-by-one here is the classic tracking-controller bug: the policy at step k observes state k and reference k, acts once, and physics runs several substeps; our interval-averaged torque comparison aligns the applied torque with τ[k], not τ[k+1]. Averaging is an implementation choice, not the only valid reward sampling convention.<\/figcaption>\n<\/figure>\n\n<h3>Prove the two models agree — before trusting anything<\/h3>\n<p>Reconciliation is a test suite, not a formality: identical joint names and order, identical joint limits, total and per-body mass, per-body CoM and principal inertias, forward kinematics at random poses, actuator transmission ratios, collision geometry placement. Run it once and it saves you from attributing a model discrepancy to your controller for a week.<\/p>\n\n<div class=\"poc\">\n<div class=\"kicker\">PoC · what reconciliation actually caught<\/div>\n<p style=\"margin-bottom:0\">Joint limits agreed to 2e-6&nbsp;rad, mass to 33.3411&nbsp;kg on both sides, FK to 4.6e-7&nbsp;m at 20 random poses. And it caught a real upstream bug: the Playground MJCF applies one shared hip-roll default class to both hips, so the right hip inherits the left's range. Irrelevant for a squat; not irrelevant for a policy exploring toward its limits. Two more worth remembering — a body-to-joint mapping cannot use a name rule (<code>torso_link<\/code> is driven by <code>waist_pitch_joint<\/code>; read <code>body_jntadr<\/code>), and <code>mj_forward<\/code> overwrites <code>qacc<\/code>, so a finite-difference acceleration must be written <em>after<\/em> it.<\/p>\n<\/div>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>Why does the exported torque need a damping term added, and what double-counts if you forget you already added it?<\/li>\n<li>Rigid contact upstream, soft contact downstream. Why is that acceptable, and what closes the gap?<\/li>\n<li>Describe the off-by-one that a naive torque reward makes.<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 7<\/div>\n<h2>What MuJoCo does with the torque you send<\/h2>\n\n<p>The tracker never sees Pinocchio. Every step of training and every validation replay runs through MuJoCo's forward dynamics, so its model of contact — not the optimizer's — is the physics the policy actually learns. The good news: MuJoCo writes the <em>same<\/em> equation as Fig. 3, with different letters and one different idea about what a contact is.<\/p>\n\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:14%\">Symbol<\/sc-raw-th><sc-raw-th style=\"width:38%\">Is<\/sc-raw-th><sc-raw-th style=\"width:26%\">Lives in<\/sc-raw-th><sc-raw-th>Fig. 3 counterpart<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><code>q<\/code>, <code>v<\/code><\/sc-raw-td><sc-raw-td>position (nq = 36), velocity (nv = 35)<\/sc-raw-td><sc-raw-td><code>qpos<\/code>, <code>qvel<\/code><\/sc-raw-td><sc-raw-td>q, v — same manifold caveat; <code>mj_differentiatePos<\/code> is the ⊖<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>M(q)<\/code><\/sc-raw-td><sc-raw-td>joint-space inertia, sparse, LᵀDL-factorised<\/sc-raw-td><sc-raw-td><code>qM<\/code><\/sc-raw-td><sc-raw-td>M(q)<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>c(q, v)<\/code><\/sc-raw-td><sc-raw-td>bias: Coriolis, centrifugal, gravity — RNE with zero acceleration<\/sc-raw-td><sc-raw-td><code>qfrc_bias<\/code><\/sc-raw-td><sc-raw-td>h(q, v)<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>τ<\/code><\/sc-raw-td><sc-raw-td>applied force = passive + actuator + user<\/sc-raw-td><sc-raw-td><code>qfrc_passive<\/code> + <code>qfrc_actuator<\/code> + <code>qfrc_applied<\/code><\/sc-raw-td><sc-raw-td>Bτ — but note <em>passive<\/em> is inside it: damping −b·q̇ is part of τ, not of c<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>J<\/code>, <code>f<\/code><\/sc-raw-td><sc-raw-td>constraint Jacobian and force — contacts, limits, equalities, friction loss, all stacked (nefc rows)<\/sc-raw-td><sc-raw-td><code>efc_J<\/code>, <code>efc_force<\/code><\/sc-raw-td><sc-raw-td>J<sub>c<\/sub>ᵀ f<sub>c<\/sub>, generalised to every constraint type<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>r(q)<\/code><\/sc-raw-td><sc-raw-td>constraint residual — for a contact, the signed distance (negative = penetration)<\/sc-raw-td><sc-raw-td><code>efc_pos<\/code><\/sc-raw-td><sc-raw-td>no counterpart: rigid contact has r ≡ 0 by construction<\/sc-raw-td><\/sc-raw-tr>\n<\/sc-raw-tbody>\n<\/sc-raw-table>\n\n<h3>One step, in pseudocode<\/h3>\n<pre>def mj_step(m, d):                                    <i># h = m.opt.timestep, 1 ms in your scene<\/i>\n    <i># mj_forward — everything below is continuous-time; nothing has been integrated yet<\/i>\n    fwd_position(d)      <i># kinematics; CoM-centred inertias; CRB -&gt; qM and its LᵀDL factor;<\/i>\n                         <i># collision -&gt; d.contact[]; constraint rows -&gt; efc_J, efc_pos<\/i>\n    fwd_velocity(d)      <i># RNE(qacc = 0) -&gt; qfrc_bias;  −b·qvel (+ springs) -&gt; qfrc_passive<\/i>\n    fwd_actuation(d)     <i># ctrl -&gt; actuator_force (gain·ctrl + bias) -&gt; gear -&gt; qfrc_actuator<\/i>\n    qacc_smooth = solve(qM, qfrc_passive + qfrc_actuator + qfrc_applied − qfrc_bias)   <i># no constraints<\/i>\n    efc_force   = argmin over admissible f of  ½ fᵀ(A + R) f + fᵀ(a_unconstrained − a_ref)  <i># convex; Newton solver<\/i>\n    qacc        = qacc_smooth + solve(qM, efc_J.T @ efc_force)   <i># qfrc_constraint = efc_Jᵀ efc_force<\/i>\n    <i># integrate — Euler treats joint damping implicitly; implicitfast also treats other velocity forces<\/i>\n    qvel = qvel + h * qacc                             <i># (M − hD) v_new = (M − hD) v + h M a, D = ∂forces/∂v<\/i>\n    qpos = qpos ⊕ h * qvel                             <i># semi-implicit: the NEW velocity moves the position<\/i><\/pre>\n\n<h3>Soft contact, annotated<\/h3>\n<p>For an unconstrained equality or fixed active-set solve, the relation below follows from f = (A+R)⁻¹(a_ref − a_u) and a_c = a_u + Af. It is an illustrative coupled-constraint relation; unilateral contact and friction-cone activation require the constrained solve. Matrix factors cannot generally be commuted.<\/p>\n<figure>\n<div class=\"eq\">\n<div class=\"eqline\" style=\"font-size:20px\"><span class=\"n\">1<\/span>a<sub style=\"font-size:.6em\">c<\/sub> = A(A+R)⁻¹ <span class=\"n\">2<\/span>a<sub style=\"font-size:.6em\">ref<\/sub> + [I − A(A+R)⁻¹] <span class=\"n\">3<\/span>a<sub style=\"font-size:.6em\">u<\/sub><\/div>\n<div class=\"eqline\" style=\"font-size:17px;margin-top:6px\"><span class=\"n\">4<\/span>R<sub style=\"font-size:.6em\">ii<\/sub> = (1 − d<sub style=\"font-size:.6em\">i<\/sub>) / d<sub style=\"font-size:.6em\">i<\/sub> · Â<sub style=\"font-size:.6em\">ii<\/sub>&nbsp;&nbsp;&nbsp;&nbsp; <span class=\"n\">5<\/span>a<sub style=\"font-size:.6em\">ref,i<\/sub> = −b<sub style=\"font-size:.6em\">i<\/sub> (Jv)<sub style=\"font-size:.6em\">i<\/sub> − k<sub style=\"font-size:.6em\">i<\/sub> r<sub style=\"font-size:.6em\">i<\/sub>&nbsp;&nbsp;&nbsp;&nbsp; A = J M⁻¹ Jᵀ<\/div>\n<div class=\"legend\">\n<div><span class=\"n\">1<\/span><strong>Constrained acceleration.<\/strong><br>What the contact point actually does, in constraint coordinates (normal first, then the two tangents). A is the inverse inertia the constraint feels.<\/div>\n<div><span class=\"n\">2<\/span><strong>Reference acceleration.<\/strong><br>A spring-damper on the residual. It plays the role of Fig. 6's Baumgarte term — but here it <em>defines<\/em> the contact rather than merely stabilising it.<\/div>\n<div><span class=\"n\">3<\/span><strong>Unconstrained acceleration.<\/strong><br>What gravity plus your torques would do with the floor removed: J·qacc_smooth + J̇v.<\/div>\n<div><span class=\"n\">4<\/span><strong>Impedance d ∈ (0, 1), from <code>solimp<\/code>.<\/strong><br>d → 1 makes R → 0: a hard constraint, a<sub>c<\/sub> = a<sub>ref<\/sub>. d → 0 removes the constraint. Â is a diagonal estimate of A so the scaling is inertia-aware: the same d feels equally stiff on a light and a heavy body.<\/div>\n<div><span class=\"n\">5<\/span><strong>Stiffness and damping, from <code>solref<\/code>.<\/strong><br>Specified as a time constant and damping ratio (defaults 0.02 s, 1.0 — critically damped). The position and velocity residuals influence contact response. Force is not determined by penetration alone; contact margins and approaching velocity can permit force before geometric penetration. The displacement/force example is specific to our scene.<\/div>\n<div><strong>Why inverse dynamics is efficient.<\/strong><br>Given (q, v, v̇) the dual problem's quadratic term is R alone — diagonal — so the solve separates by contact, with friction components coupled within a contact. Rigid-contact kinematics alone generally cannot identify contact and actuator forces; extra force information or a force-distribution objective can make inverse dynamics well posed. MuJoCo's <code>fwdinv<\/code> flag checks forward against inverse every step.<\/div>\n<\/div>\n<\/div>\n<figcaption>Fig. 14 — An illustrative unconstrained soft-contact relation, not a universal scalar blend for all frictional contacts. The simulator contact model differs from rigid TO contact. Randomizing contact parameters is an extension to evaluate; a tracking reward does not guarantee that the discrepancy is absorbed.<\/figcaption>\n<\/figure>\n\n<h3>Validation check 1, in pseudocode<\/h3>\n<pre><i># \"does the reference balance under MuJoCo's model?\"  — inverse dynamics with the optimizer's wrenches<\/i>\nm.opt.disableflags |= CONTACT                          <i># we supply the ground force ourselves<\/i>\nfor k in range(N):\n    d.qpos[:], d.qvel[:] = qpos[k], qvel[k]\n    mj_forward(m, d)                                   <i># kinematics, qM, qfrc_bias, qfrc_passive at this state<\/i>\n    d.qacc[:] = (qvel[k+1] − qvel[k]) / dt             <i># AFTER mj_forward: it overwrites qacc<\/i>\n    d.qfrc_applied[:] = 0\n    for foot in (L, R):\n        mj_applyFT(m, d, force=f_ref[foot][k], torque=tau_ref[foot][k],\n                   point=sole_pos_world(foot), body=ankle_roll_body(foot), qfrc_target=d.qfrc_applied)\n    mj_inverse(m, d)                                   <i># qfrc_inverse = M·qacc + c − Jᵀf   (f = 0 here)<\/i>\n    motor = d.qfrc_inverse − d.qfrc_passive − d.qfrc_applied   <i># what the actuators must have supplied<\/i>\n    assert norm(motor[:6]) ≈ 0                         <i># base rows: unactuated — measured 0.38 N, 0.00 N·m<\/i>\n    assert rms(motor[6:] − u_ref[k]) &lt; 0.01           <i># joint rows: the exported torque — measured 0.0007 N·m<\/i><\/pre>\n<p style=\"font-size:12.5px;color:var(--color-neutral-700)\">Subtracting <code>qfrc_passive<\/code> is the same fact as the \"τ = u + b·q̇\" row of section 6 seen from the other side: MuJoCo's τ already contains damping, the optimizer's u does not.<\/p>\n\n<div class=\"poc\">\n<div class=\"kicker\">PoC · three traps this section explains<\/div>\n<p style=\"margin-bottom:0\"><strong>The contact frame's normal is its x axis<\/strong>, not z — MuJoCo orders the frame normal-first so that frictionless contacts use only the first row. Read <code>mj_contactForce<\/code> as [normal, tangent₁, tangent₂, …] and rotate with <code>contact.frame<\/code> before comparing to <code>foot_wrench_*<\/code>. <strong>Friction is combined by element-wise maximum<\/strong> of the two geoms unless a <code>priority<\/code> is set — a floor at 1.0 dominates a foot at 0.6, which is why the scene reads 1.0. <strong>Twenty substeps per node.<\/strong> The reference is sampled at 20 ms, physics runs at 1 ms; our interval-averaged torque reward compares the mean applied torque across those twenty steps (Fig. 13), and a replay must hold u[k] constant across all of them, not interpolate it.<\/p>\n<\/div>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>What additional information is needed to determine actuator and contact forces in rigid-contact inverse dynamics?<\/li>\n<li>What do d, k and b each control, and which of them has a counterpart in the optimizer's problem?<\/li>\n<li>Passive damping is inside τ on the MuJoCo side. List every place in the pipeline where that fact has to be remembered.<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 8<\/div>\n<h2>The tracking policy: PPO with an asymmetric critic<\/h2>\n\n<p>The learning half is deliberately conventional. PPO, one trajectory sampled per episode, a separate policy per task, MLP [512, 512, 256, 256] for both actor and critic, under 300M steps and under 7 hours on a single RTX 4090. The interesting design is not the algorithm; it is the <em>information routing<\/em>.<\/p>\n\n<figure>\n<svg sc-camel-view-box=\"0 0 672 250\" width=\"100%\" role=\"img\" aria-label=\"Actor and critic observation contents, action pathway\">\n<g font-family=\"Archivo, sans-serif\">\n<g fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2\"><rect x=\"0\" y=\"20\" width=\"320\" height=\"130\"><\/rect><rect x=\"352\" y=\"20\" width=\"320\" height=\"130\"><\/rect><\/g>\n<rect x=\"0\" y=\"20\" width=\"320\" height=\"5\" fill=\"#201e1d\"><\/rect><rect x=\"352\" y=\"20\" width=\"320\" height=\"5\" fill=\"#ec3013\"><\/rect>\n<g font-size=\"13\" font-weight=\"800\" fill=\"#201e1d\"><text x=\"14\" y=\"46\">ACTOR — deployable sensors only<\/text><text x=\"366\" y=\"46\">CRITIC — actor obs + privileged<\/text><\/g>\n<g font-size=\"10.5\" fill=\"#201e1d\">\n<text x=\"14\" y=\"68\">noisy base linear + angular velocity<\/text>\n<text x=\"14\" y=\"84\">projected gravity<\/text>\n<text x=\"14\" y=\"100\">joint position history · 10 frames @ 50 Hz<\/text>\n<text x=\"14\" y=\"116\">joint velocity, action history<\/text>\n<text x=\"14\" y=\"132\" fill=\"#ae1800\">partial reference: base twist, q, force, torque<\/text>\n<text x=\"366\" y=\"68\">base position and orientation<\/text>\n<text x=\"366\" y=\"84\">EE positions relative to torso<\/text>\n<text x=\"366\" y=\"100\">true contact force, true torque, Kp, Kd<\/text>\n<text x=\"366\" y=\"116\" fill=\"#ae1800\">full reference: pose, twist, q, q̇, EE, F, u<\/text>\n<text x=\"366\" y=\"132\" fill=\"#605d5d\">discarded at deployment<\/text>\n<\/g>\n<g fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2\"><rect x=\"0\" y=\"176\" width=\"672\" height=\"54\"><\/rect><\/g>\n<text x=\"14\" y=\"198\" font-size=\"12\" font-weight=\"800\" fill=\"#201e1d\">ACTION<\/text>\n<text x=\"110\" y=\"198\" font-size=\"14\" font-weight=\"800\" fill=\"#ec3013\">u = K_p (a + q_default − q) − K_d q̇<\/text>\n<text x=\"110\" y=\"218\" font-size=\"10.5\" fill=\"#605d5d\">Default-pose offset. Policy 200 Hz; PD: 1 kHz simulation, 2 kHz hardware.<\/text>\n<\/g>\n<\/svg>\n<figcaption>Fig. 15 — Asymmetric actor-critic: the critic is trained with simulator ground truth the actor will never have, which sharpens value estimates without making the actor undeployable. The reference is <em>partially<\/em> visible to the actor and <em>fully<\/em> visible to the critic.<\/figcaption>\n<\/figure>\n\n\n<h3>The update, and how clipping limits its incentive<\/h3>\n<p>PPO reuses a rollout batch for several optimization epochs. Its clipped surrogate reduces incentives for large policy changes but does not enforce a trust region or guarantee a bounded policy update.<\/p>\n<figure>\n<div class=\"eq\">\n<div class=\"eqline\" style=\"font-size:19px\">L(s, a, θ<sub style=\"font-size:.6em\">k<\/sub>, θ) = min( <span class=\"n\">1<\/span>r<sub style=\"font-size:.6em\">θ<\/sub>(s, a) · <span class=\"n\">2<\/span>Â(s, a) ,&nbsp; <span class=\"n\">3<\/span>clip(r<sub style=\"font-size:.6em\">θ<\/sub>, 1−ε, 1+ε) · Â )<\/div>\n<div class=\"eqsub\">r_θ(s, a) = π_θ(a | s) / π_θₖ(a | s) &nbsp;·&nbsp; θ_{k+1} = argmax_θ E_{s,a ~ π_θₖ}[ L ] &nbsp;·&nbsp; equivalently L = min( r·Â, g(ε, Â) ) with g = (1+ε)Â if Â ≥ 0 else (1−ε)Â<\/div>\n<div class=\"legend\">\n<div><span class=\"n\">1<\/span><strong>Probability ratio.<\/strong><br>Exactly 1 on the first gradient step of an update, drifting as θ moves. Computed as exp(log π<sub>θ<\/sub> − log π<sub>θₖ<\/sub>) with the old log-probs stored at rollout time.<\/div>\n<div><span class=\"n\">2<\/span><strong>Advantage estimate.<\/strong><br>\"How much better than expected was this action\" — from the critic via GAE below. Here is where asymmetry enters: Â is computed with the <em>privileged<\/em> critic, but it only ever weights the gradient; the actor's input stays deployable.<\/div>\n<div><span class=\"n\">3<\/span><strong>Clip, then min.<\/strong><br>The min makes the objective pessimistic: for Â &gt; 0 the ratio is capped at 1+ε, for Â &lt; 0 it is floored at 1−ε. Past the clip the gradient is zero — the sample simply stops arguing for further change. ε = 0.2 is the customary value.<\/div>\n<\/div>\n<\/div>\n<figcaption>Fig. 16 — The clipped objective. Clipping removes the <em>incentive<\/em> to move far; it does not forbid it, and the policy can still drift past 1±ε on samples that agree. Implementations therefore add a guard — Spinning Up stops the epoch early once the mean KL between old and new policy exceeds a target (0.01 by default).<\/figcaption>\n<\/figure>\n<figure>\n<svg sc-camel-view-box=\"0 0 672 150\" width=\"100%\" role=\"img\" aria-label=\"Clipped surrogate objective versus probability ratio for positive and negative advantage\">\n<g font-family=\"Archivo, sans-serif\">\n<g stroke=\"#201e1d\" stroke-width=\"1.5\" fill=\"none\"><path d=\"M40 118 H330 M40 118 V20 M376 118 H666 M376 118 V20\"><\/path><\/g>\n<g stroke=\"#d7d3d3\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><path d=\"M152 20 V118 M208 20 V118 M488 20 V118 M544 20 V118\"><\/path><\/g>\n<path d=\"M40,110 L208,38 L320,38\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2.5\"><\/path>\n<path d=\"M376,98 L488,98 L534.7,118\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2.5\"><\/path>\n<path d=\"M208,38 L320,38\" stroke=\"#ec3013\" stroke-width=\"2.5\"><\/path>\n<path d=\"M376,98 L488,98\" stroke=\"#ec3013\" stroke-width=\"2.5\"><\/path>\n<circle cx=\"180\" cy=\"50\" r=\"4\" fill=\"#ec3013\"><\/circle><circle cx=\"516\" cy=\"110\" r=\"4\" fill=\"#ec3013\"><\/circle>\n<g font-size=\"9.5\" fill=\"#605d5d\" text-anchor=\"middle\"><text x=\"152\" y=\"132\">1−ε<\/text><text x=\"180\" y=\"132\">1<\/text><text x=\"208\" y=\"132\">1+ε<\/text><text x=\"488\" y=\"132\">1−ε<\/text><text x=\"516\" y=\"132\">1<\/text><text x=\"544\" y=\"132\">1+ε<\/text><\/g>\n<g font-size=\"11\" font-weight=\"800\" fill=\"#201e1d\"><text x=\"40\" y=\"14\">A &gt; 0 — make the action likelier, up to a ceiling<\/text><text x=\"376\" y=\"14\">A &lt; 0 — make it rarer, up to a ceiling<\/text><\/g>\n<g font-size=\"10\" fill=\"#ae1800\"><text x=\"219.20000000000002\" y=\"32\">flat: no gradient past here<\/text><text x=\"383\" y=\"92\">flat: no gradient past here<\/text><\/g>\n<g font-size=\"9.5\" fill=\"#605d5d\"><text x=\"300\" y=\"146\">r = π_θ / π_θₖ →<\/text><text x=\"636\" y=\"146\">r →<\/text><\/g>\n<\/g>\n<\/svg>\n<figcaption>Fig. 17 — The same objective drawn. The red dot is where every update starts (r = 1); the red flats are where the sample has nothing more to say.<\/figcaption>\n<\/figure>\n\n<h3>Where Â comes from<\/h3>\n<figure>\n<div class=\"eq\">\n<div class=\"eqline\" style=\"font-size:18px\"><span class=\"n\">4<\/span>δ<sub style=\"font-size:.6em\">t<\/sub> = r<sub style=\"font-size:.6em\">t<\/sub> + γ V(s<sub style=\"font-size:.6em\">t+1<\/sub>) − V(s<sub style=\"font-size:.6em\">t<\/sub>)&nbsp;&nbsp;&nbsp;&nbsp; <span class=\"n\">5<\/span>Â<sub style=\"font-size:.6em\">t<\/sub> = Σ<sub style=\"font-size:.6em\">l ≥ 0<\/sub> (γλ)<sup style=\"font-size:.6em\">l<\/sup> δ<sub style=\"font-size:.6em\">t+l<\/sub>&nbsp;&nbsp;&nbsp;&nbsp; <span class=\"n\">6<\/span>R̂<sub style=\"font-size:.6em\">t<\/sub> = Â<sub style=\"font-size:.6em\">t<\/sub> + V(s<sub style=\"font-size:.6em\">t<\/sub>)<\/div>\n<div class=\"legend\">\n<div><span class=\"n\">4<\/span><strong>One-step TD error.<\/strong><br>The reward you got plus what the critic thinks the next state is worth, minus what it thought this one was worth. For an exact policy value, its conditional expectation is zero under that policy; individual sampled TD errors need not vanish.<\/div>\n<div><span class=\"n\">5<\/span><strong>GAE — exponentially weighted TD errors.<\/strong><br>λ = 0 is pure one-step bootstrapping (low variance, biased by the critic); λ = 1 telescopes to a discounted return minus the value baseline for a complete episode; truncated rollouts still require bootstrapping and can retain value-estimation error. 0.95–0.97 is typical. γ discounts; at 200 Hz, γ = 0.99 is a 0.5 s horizon — worth knowing when a squat takes 3.4 s.<\/div>\n<div><span class=\"n\">6<\/span><strong>Value target.<\/strong><br>The critic is then regressed on (V<sub>φ<\/sub>(s<sub>t<\/sub>) − R̂<sub>t<\/sub>)². In the asymmetric design s<sub>t<\/sub> here is the <em>right-hand column<\/em> of Fig. 15, not the left.<\/div>\n<\/div>\n<\/div>\n<\/figure>\n\n<h3>The whole loop, in pseudocode<\/h3>\n<pre>for iteration in range(K):\n    <i># 1 · rollout: thousands of parallel simulators; each episode samples one reference trajectory<\/i>\n    for t in range(T):\n        o_actor, o_critic = observe(envs)                <i># Fig. 15 — left column, right column<\/i>\n        a = sample(π_θ(· | o_actor));  logp_old = log π_θ(a | o_actor)\n        u = Kp * (a + q_default − q) − Kd * q̇             <i># PD at 1 kHz, 5 substeps per policy step<\/i>\n        r = Σ_i w_i · tracking_reward_i(err_i) − penalties      <i># section 9: squared L2, except force L1<\/i>\n        terminated = fell; truncated = reference_ended                   <i># illustrative: a true fall is terminal; the chosen time limit truncates<\/i>\n        store(o_actor, o_critic, a, logp_old, r, V_φ(o_critic), terminated, truncated)\n    <i># 2 · advantages, once per batch, with the privileged critic<\/i>\n    δ = r + γ · V_next · (1 − terminated) − V;   Â = gae(δ, γ, λ, stop_at=terminated or truncated);   R̂ = Â + V     <i># <\/i><b>4 5 6<\/b>\n    Â = (Â − mean(Â)) / std(Â)                           <i># per-batch normalisation, near-universal<\/i>\n    <i># 3 · several epochs on the same batch — this is what the clip buys<\/i>\n    for epoch in range(E):\n        for mb in minibatches(batch):\n            ratio  = exp(log π_θ(mb.a | mb.o_actor) − mb.logp_old)          <i># <\/i><b>1<\/b>\n            L_clip = −mean(min(ratio · mb.Â, clip(ratio, 1−ε, 1+ε) · mb.Â))  <i># <\/i><b>3<\/b>\n            L_v    = mean((V_φ(mb.o_critic) − mb.R̂)²)\n            loss   = L_clip + c_v · L_v − c_e · entropy(π_θ(· | mb.o_actor))\n            adam_step(loss);  clip_grad_norm(θ, φ)\n        if mean_kl(π_θₖ, π_θ) &gt; target_kl: break          <i># the guard from Fig. 16's caption<\/i>\n    θ_k = θ;  curriculum.step()                          <i># ramp observation noise and penalties<\/i><\/pre>\n<p style=\"font-size:12.5px;color:var(--color-neutral-700)\">This pseudocode illustrates DeepMimic-style reference-state initialization and early termination. Random-phase initialization, fall handling, and PPO hyperparameters shown here should not be treated as verified Opt2Skill implementation details. For truncated rollouts, bootstrap the value at the cutoff; only true terminal states have zero continuation value.<\/p>\n<h3>Three design choices worth being able to defend<\/h3>\n<p><strong>Offset from default pose.<\/strong> This is the paper’s action convention. A reference-relative residual is an alternative parameterization worth comparing experimentally; using it would not inherently make an ablation dishonest or prevent learning. The reference already conditions the actor in the published design.<\/p>\n<p><strong>Torque appears in the observation and the reward, not as feedforward.<\/strong> This tests torque-conditioned imitation with torque supervision. Because observation and reward change together, the ablation does not isolate their individual effects. A direct feedforward controller is a separate baseline; its benefits must be measured.<\/p>\n<p><strong>Observation history of 10 samples.<\/strong> The paper reports favorable overall results with this history length. Its joint-position/action histories are sampled every four control steps, or 50 Hz at a 200 Hz policy rate. Why longer histories underperform is not isolated by the ablation; overfitting is a hypothesis, not a demonstrated cause.<\/p>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>What exactly makes the actor-critic \"asymmetric\", and why is it not cheating?<\/li>\n<li>Argue for offsetting the action from the default pose rather than the reference. Then argue against.<\/li>\n<li>Distinguish \"torque in the reward\" from \"torque as feedforward\". Which does this paper do, and why does the distinction matter for the ablation?<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 9<\/div>\n<h2>Rewards, randomization, and reading the evidence<\/h2>\n\n<p>Most tracking rewards use <code>exp(−k‖e‖²₂)<\/code>; contact force uses <code>exp(−k‖e‖₁)<\/code>. Weights, error units, dimensions, and observed residuals jointly determine the tradeoff. Coefficients alone cannot rank importance or prove that position tracking dominates force regulation.<\/p>\n\n<figure>\n<svg sc-camel-view-box=\"0 0 672 182\" width=\"100%\" role=\"img\" aria-label=\"Reward exp(-k error squared) for three values of k\">\n<g font-family=\"Archivo, sans-serif\">\n<g stroke=\"#201e1d\" stroke-width=\"1.5\" fill=\"none\"><path d=\"M40 130 H640 M40 130 V16\"><\/path><\/g>\n<path d=\"M40 75 H640\" stroke=\"#d7d3d3\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\/path>\n<path d=\"M40,20 L46,20 L52,20 L58,20 L64,20.1 L70,20.1 L76,20.2 L82,20.3 L88,20.4 L94,20.4 L100,20.5 L106,20.7 L112,20.8 L118,20.9 L124,21.1 L130,21.2 L136,21.4 L142,21.6 L148,21.8 L154,22 L160,22.2 L166,22.4 L172,22.6 L178,22.9 L184,23.1 L190,23.4 L196,23.7 L202,23.9 L208,24.2 L214,24.5 L220,24.8 L226,25.2 L232,25.5 L238,25.8 L244,26.2 L250,26.5 L256,26.9 L262,27.3 L268,27.7 L274,28.1 L280,28.5 L286,28.9 L292,29.3 L298,29.7 L304,30.1 L310,30.6 L316,31 L322,31.5 L328,32 L334,32.4 L340,32.9 L346,33.4 L352,33.9 L358,34.4 L364,34.9 L370,35.4 L376,36 L382,36.5 L388,37 L394,37.6 L400,38.1 L406,38.7 L412,39.2 L418,39.8 L424,40.4 L430,40.9 L436,41.5 L442,42.1 L448,42.7 L454,43.3 L460,43.9 L466,44.5 L472,45.1 L478,45.7 L484,46.3 L490,47 L496,47.6 L502,48.2 L508,48.9 L514,49.5 L520,50.1 L526,50.8 L532,51.4 L538,52.1 L544,52.7 L550,53.4 L556,54 L562,54.7 L568,55.3 L574,56 L580,56.6 L586,57.3 L592,58 L598,58.6 L604,59.3 L610,59.9 L616,60.6 L622,61.3 L628,61.9 L634,62.6 L640,63.3\" fill=\"none\" stroke=\"#a19c9c\" stroke-width=\"2\"><\/path>\n<path d=\"M40,20 L46,20.1 L52,20.2 L58,20.5 L64,20.9 L70,21.4 L76,22 L82,22.7 L88,23.5 L94,24.4 L100,25.4 L106,26.5 L112,27.6 L118,28.9 L124,30.3 L130,31.7 L136,33.2 L142,34.8 L148,36.5 L154,38.2 L160,39.9 L166,41.8 L172,43.6 L178,45.6 L184,47.5 L190,49.5 L196,51.5 L202,53.6 L208,55.7 L214,57.8 L220,59.9 L226,62 L232,64.1 L238,66.2 L244,68.3 L250,70.4 L256,72.5 L262,74.5 L268,76.6 L274,78.6 L280,80.6 L286,82.5 L292,84.5 L298,86.4 L304,88.2 L310,90 L316,91.8 L322,9 ddle\"><text x=\"110.6\" y=\"144\">0.12<\/text><text x=\"263.4\" y=\"144\">0.37<\/text><text x=\"640\" y=\"144\">‖err‖ = 1<\/text><\/g>\n<text x=\"160\" y=\"107.1\" font-size=\"10.5\" font-weight=\"800\" fill=\"#ae1800\">k = 50 · base orientation<\/text>\n<text x=\"340\" y=\"90.5\" font-size=\"10.5\" font-weight=\"800\" fill=\"#201e1d\">k = 5 · joint position<\/text>\n<text x=\"472\" y=\"37.1\" font-size=\"10.5\" font-weight=\"800\" fill=\"#605d5d\">k = 0.5 · base angular velocity<\/text>\n<text x=\"40\" y=\"160\" font-size=\"10\" fill=\"#605d5d\">Half-credit L2 norm = √(ln 2 / k); use each residual’s own units and representation.<\/text><text x=\"40\" y=\"173\" font-size=\"10\" fill=\"#605d5d\">Torque half-credit L2 norm: 8.3 N·m; RMS = 8.3 / √n for n joint errors.<\/text>\n<\/g>\n<\/svg>\n<figcaption>Fig. 18 — These curves illustrate squared-L2 rewards, not the force L1 reward. The horizontal variable is an error norm in the term’s own representation; orientation coordinates are not automatically an angle in radians. At k = 0.01, torque half-credit occurs at L2 norm 8.3 N·m, or RMS 1.86 N·m for 20 joints. Do not compare that norm directly with the G1 example’s reference-torque RMS.<\/figcaption>\n<\/figure>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:34%\">Term<\/sc-raw-th><sc-raw-th style=\"width:14%\">k<\/sc-raw-th><sc-raw-th style=\"width:16%\">Weight<\/sc-raw-th><sc-raw-th>What the k is telling you<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Joint position<\/sc-raw-td><sc-raw-td>5<\/sc-raw-td><sc-raw-td>0.30<\/sc-raw-td><sc-raw-td>joint-error L2 norm in radians<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Base orientation<\/sc-raw-td><sc-raw-td>50<\/sc-raw-td><sc-raw-td>0.30<\/sc-raw-td><sc-raw-td>orientation-representation error; not a fall guarantee<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Base position <span class=\"text-muted\">(not for walking)<\/span><\/sc-raw-td><sc-raw-td>20<\/sc-raw-td><sc-raw-td>0.30<\/sc-raw-td><sc-raw-td>position-error L2 norm; omitted for walking<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>End-effector position<\/sc-raw-td><sc-raw-td>20<\/sc-raw-td><sc-raw-td>0.30<\/sc-raw-td><sc-raw-td>end-effector position-error L2 norm<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Base linear velocity<\/sc-raw-td><sc-raw-td>2<\/sc-raw-td><sc-raw-td>0.30<\/sc-raw-td><sc-raw-td>linear-velocity error in m/s<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Base angular velocity<\/sc-raw-td><sc-raw-td>0.5<\/sc-raw-td><sc-raw-td>0.30<\/sc-raw-td><sc-raw-td>angular-velocity error in rad/s<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Joint torque<\/strong><\/sc-raw-td><sc-raw-td>0.01<\/sc-raw-td><sc-raw-td>0.10<\/sc-raw-td><sc-raw-td>soft torque tracking; account for joint count<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Contact force<\/strong> (L1)<\/sc-raw-td><sc-raw-td>0.05<\/sc-raw-td><sc-raw-td>0.10<\/sc-raw-td><sc-raw-td>L1 force error; different shape from squared-L2 terms<\/sc-raw-td><\/sc-raw-tr>\n<\/sc-raw-tbody>\n<\/sc-raw-table>\n<p>Penalties: action rate (second difference) −0.05, normalized torque −0.03, joint acceleration −1e-6. A noise curriculum ramps observation noise and penalty strength up over training, so early learning is easy and late learning is robust.<\/p>\n\n<h3>Domain randomization<\/h3>\n<p>Gaussian observation noise on joint position (0.0875), joint velocity (0.075), base velocities (0.15) and gravity (0.075); action delay U[0, 20 ms]; motor strength U[0.95, 1.05]; Kp/Kd factor U[0.9, 1.1]; mass U[0.9, 1.1]; gravity U[0.9, 1.1]; friction U[0.3, 1.0]; terrain flat or rough. The friction scaling spans a broad interval. Comparing ranges across different quantities does not establish relative sensitivity or the authors’ expectations.<\/p>\n\n<h3>The results that matter<\/h3>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:34%\">Walking, task-space tracking<\/sc-raw-th><sc-raw-th style=\"width:22%\">TO refs<\/sc-raw-th><sc-raw-th style=\"width:22%\">Human mocap<\/sc-raw-th><sc-raw-th>IK<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Hand error<\/sc-raw-td><sc-raw-td><strong>2.0 cm<\/strong><\/sc-raw-td><sc-raw-td>4.25 cm<\/sc-raw-td><sc-raw-td>5.47 cm<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Foot error<\/sc-raw-td><sc-raw-td><strong>5.2 cm<\/strong><\/sc-raw-td><sc-raw-td>9.4 cm<\/sc-raw-td><sc-raw-td>5.2 cm<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>x-drift<\/sc-raw-td><sc-raw-td><strong>1.1%<\/strong><\/sc-raw-td><sc-raw-td>4.5%<\/sc-raw-td><sc-raw-td>2.1%<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Rough terrain, max stair height<\/sc-raw-td><sc-raw-td><strong>12 cm<\/strong><\/sc-raw-td><sc-raw-td colspan=\"2\">others fail beyond 8 cm<\/sc-raw-td><\/sc-raw-tr>\n<\/sc-raw-tbody>\n<\/sc-raw-table>\n\n<p><strong>The wiping ablation is the cleanest experiment in the paper<\/strong> and the one to reach for in an argument. 1400 TO trajectories, desk height 0.85–0.95 m, normal force 0–20 N, four conditions:<\/p>\n<figure>\n<svg sc-camel-view-box=\"0 0 672 132\" width=\"100%\" role=\"img\" aria-label=\"Wiping ablation force error by condition\">\n<g font-family=\"Archivo, sans-serif\">\n<line x1=\"0\" y1=\"2\" x2=\"672\" y2=\"2\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<g><rect x=\"120\" y=\"16\" width=\"468\" height=\"20\" fill=\"#201e1d\"><\/rect><rect x=\"120\" y=\"44\" width=\"112\" height=\"20\" fill=\"#ec3013\"><\/rect><rect x=\"120\" y=\"72\" width=\"108\" height=\"20\" fill=\"#ec3013\"><\/rect><rect x=\"120\" y=\"100\" width=\"60\" height=\"20\" fill=\"#ec3013\"><\/rect><\/g>\n<g font-size=\"12\" font-weight=\"800\" fill=\"#201e1d\"><text x=\"0\" y=\"31\">Pos<\/text><text x=\"0\" y=\"59\">Pos + F<\/text><text x=\"0\" y=\"87\">Pos + T<\/text><text x=\"0\" y=\"115\">Pos + F + T<\/text><\/g>\n<g font-size=\"12\" font-weight=\"800\"><text x=\"600\" y=\"31\" fill=\"#201e1d\">11.7 N<\/text><text x=\"244\" y=\"59\" fill=\"#ae1800\">2.8 N<\/text><text x=\"240\" y=\"87\" fill=\"#ae1800\">2.7 N<\/text><text x=\"192\" y=\"115\" fill=\"#ae1800\">1.5 N<\/text><\/g>\n<\/g>\n<\/svg>\n<figcaption>Fig. 19 — Simulation force-error averages from Table IV across tested target-force groups. Pos+T approaches Pos+F in average error, supporting useful contact-related information in torque references. It does not prove unique recovery of force from torque or separate observation benefits from reward benefits. Combined supervision has the lowest reported average force error.<\/figcaption>\n<\/figure>\n\n<div class=\"poc\">\n<div class=\"kicker\">PoC · a separate feedforward-controller experiment<\/div>\n<p style=\"margin-bottom:0\">Your recorded controller experiment compares identical PD gains and targets with and without feedforward reference torque: 1.1 cm tracking with feedforward versus a fall without it. This supports that controller design for the tested squat. It is not the paper’s learned Pos versus Pos+T ablation, does not establish a universal failure of PD control, and does not isolate the informational value of torque inputs to RL.<\/p>\n<\/div>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>The torque reward has the lowest k and one of the lowest weights. Reconcile that with it being the paper's central claim.<\/li>\n<li>What does Pos+T ≈ Pos+F support, and what causal conclusions does it leave unresolved?<\/li>\n<li>Why can randomization ranges alone not establish which uncertainties matter most?<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 10<\/div>\n<h2>Lineage, misconceptions, and what to attack<\/h2>\n\n<h3>Where it sits<\/h3>\n<figure>\n<svg sc-camel-view-box=\"0 0 672 128\" width=\"100%\" role=\"img\" aria-label=\"Lineage from DeepMimic to Opt2Skill\">\n<g font-family=\"Archivo, sans-serif\">\n<line x1=\"0\" y1=\"60\" x2=\"672\" y2=\"60\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<g fill=\"#201e1d\"><circle cx=\"20\" cy=\"60\" r=\"6\"><\/circle><circle cx=\"220\" cy=\"60\" r=\"6\"><\/circle><circle cx=\"420\" cy=\"60\" r=\"6\"><\/circle><\/g>\n<circle cx=\"640\" cy=\"60\" r=\"9\" fill=\"#ec3013\"><\/circle>\n<g font-size=\"13\" font-weight=\"800\" fill=\"#201e1d\"><text x=\"0\" y=\"38\">DeepMimic<\/text><text x=\"180\" y=\"38\">OPT-Mimic<\/text><text x=\"368\" y=\"38\">MIMOC<\/text><\/g>\n<text x=\"556\" y=\"38\" font-size=\"13\" font-weight=\"800\" fill=\"#ae1800\">Opt2Skill<\/text>\n<g font-size=\"10\" fill=\"#605d5d\">\n<text x=\"0\" y=\"84\">2018 · mocap refs<\/text><text x=\"0\" y=\"97\">exp(−k·err²), RSI, ET<\/text>\n<text x=\"180\" y=\"84\">2022 · Solo 8 quadruped<\/text><text x=\"180\" y=\"97\">TO refs, feedforward study<\/text>\n<text x=\"368\" y=\"84\">2023 · Mini Cheetah,<\/text><text x=\"368\" y=\"97\">MIT Humanoid, torque refs<\/text>\n<text x=\"524\" y=\"84\" fill=\"#ae1800\">2024–25 · full-order humanoid,<\/text><text x=\"524\" y=\"97\" fill=\"#ae1800\">loco-manipulation, hardware<\/text>\n<\/g>\n<line x1=\"0\" y1=\"118\" x2=\"672\" y2=\"118\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<\/g>\n<\/svg>\n<figcaption>Fig. 20 — Each step keeps the reward machinery and swaps the reference source or scales the platform. Opt2Skill's specific increment: humanoid scale, manipulation contact, and the controlled Pos/F/T ablation.<\/figcaption>\n<\/figure>\n\n<h3>Misconceptions to have already discarded<\/h3>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:44%\">Tempting reading<\/sc-raw-th><sc-raw-th>What is actually true<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>\"It's RL with a residual on top of the optimal trajectory.\"<\/sc-raw-td><sc-raw-td>No residual. The action is an offset from a fixed default pose; the reference enters through observation and reward only.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>\"The optimizer plans the footsteps.\"<\/sc-raw-td><sc-raw-td>The contact schedule is a hand-specified input per task.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>\"Shooting means only controls are decision variables.\"<\/sc-raw-td><sc-raw-td>That is <em>single<\/em> shooting. FDDP is a multiple-shooting flavour that tolerates defects between nodes.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>\"DDP and iLQR are the same thing.\"<\/sc-raw-td><sc-raw-td>iLQR drops the second-order dynamics terms. Most robotics \"DDP\" is iLQR.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>\"Better references means geometrically better.\"<\/sc-raw-td><sc-raw-td>IK has lower joint-angle error in this comparison, while TO improves several task-space and drift metrics. Neither establishes a universal geometric ranking.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>\"Torque tracking makes the policy stronger.\"<\/sc-raw-td><sc-raw-td>Torque observations and supervision improve the reported results together. Separate ablations are needed to identify which component causes the gain.<\/sc-raw-td><\/sc-raw-tr>\n<\/sc-raw-tbody>\n<\/sc-raw-table>\n\n<h3>Fair lines of attack<\/h3>\n<ul style=\"margin:0 0 12px;padding-left:1.15em\">\n<li><strong>Local feedback is an untested baseline.<\/strong> Test exported DDP gains as a teacher or local controller. Model mismatch and contact changes limit these gains; it is inaccurate to describe RL as merely repeating stabilization already solved.<\/li>\n<li><strong>One policy per task.<\/strong> General cross-task policy sharing and learned task composition are not established. Parameter conditioning within one task is a different capability; the paper also describes composing reference motions for pickup and walking.<\/li>\n<li><strong>The contact schedule is hand-designed.<\/strong> Everything downstream inherits that human choice; the method cannot discover a new contact strategy.<\/li>\n<li><strong>Reference generation cost is not confronted.<\/strong> Thousands of full-order solves per task, offline. Whether this scales to a skill library is not shown.<\/li>\n<li><strong>Torque as feedforward is untested here.<\/strong> OPT-Mimic studied feedforward designs; this paper only routes torque through observation and reward. The comparison is missing.<\/li>\n<\/ul>\n\n\n<h3>Deployment and reactive wiping: what the evidence supports<\/h3>\n<p>The actor receives proprioception/history and desired force/torque references; measured contact force is privileged critic information in the published formulation. Deployment uses partial references from offline trajectories, with unchanged-reference mismatch tests also reported. This is feedback control without online TO, not an open-loop policy.<\/p>\n<p><strong>Design implications.<\/strong> For an unknown table, retrieve precomputed references and train with the same retrieval errors used at runtime. Observe the table plane and wrist force, track the wiping region relative to the table, and train base repositioning, contact loss and re-approach. Permit departure from incompatible nominal joint/torque targets even after contact returns. An admittance layer must be trained with the policy and validated; it does not guarantee a force ceiling. PD position error can increase force, but PD has no integral windup.<\/p>\n<p><strong>Acceptance criteria.<\/strong> A 15 N target with a 13–17 N band requires measuring every excursion during established wiping contact, with contact state defined independently of force compliance. Any tolerated excursion duration, recovery budget or emergency cap is an additional design choice. Aggregate mean errors do not establish continuous compliance. Test unseen heights, lateral displacement, pushes, perception bias, sensor faults and resumed coverage.<\/p>\n<p><strong>Transport extension.<\/strong> A board-inclusive model needs feasible support geometry, friction and grip-force limits, material-damage limits and continuous actuator limits. Under-edge support does not automatically unload the wrist. Use torque utilization ≤90% if reserving 10% headroom. A failed local solve is inconclusive; a solved nominal reference does not guarantee a residual controller remains feasible.<\/p>\n<p>Sources: <a href=\"https://arxiv.org/html/2409.20514v6\">Opt2Skill v6, §§III–IV<\/a>; <a href=\"https://mujoco.readthedocs.io/en/stable/computation/index.html\">MuJoCo computation reference<\/a>. Schematics and extension proposals are study explanations, not reported paper experiments.<\/p>\n\n<h3>Reading order for the paper itself<\/h3>\n<p style=\"margin-bottom:0\">Abstract → §IV results and ablations → §III-A trajectory optimization → §III-B policy and rewards → §II related work → §V conclusion.<\/p>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>State the paper's contribution in one sentence that would not also describe MIMOC.<\/li>\n<li>Pick the criticism above you find strongest and steelman the authors' reply.<\/li>\n<li>What experiment would settle whether the torque channel's value is informational or control-theoretic?<\/li><\/ol><\/div>\n<\/section>\n\n\n<section id=\"from-reference-to-feedback\">\n<div class=\"kicker\">Section 11 · implementation walkthrough<\/div>\n<h2>From a squat reference to a general controller<\/h2>\n<p>The G1 code currently optimizes references and follows them with a fixed feedback controller. It has no learned policy yet. These notes connect the command-line experiments to IK, task design, policy training, and online optimization; extensions below are proposals.<\/p>\n\n<h3>What the commands actually prove<\/h3>\n<p><strong>Reconciliation<\/strong> compares the Pinocchio and MuJoCo models after configured corrections: joint order and limits, masses, link CoM offsets, principal inertias, selected frame positions in 20 random poses, foot geometry, and actuator assumptions. Matching models make subsequent comparisons meaningful; they do not prove any motion feasible or either model physically exact. The inertia check compares principal moments, and the kinematics check compares selected positions rather than full poses.<\/p>\n<p><strong>Kinematic viewing<\/strong> directly sets saved states like animation. <strong>Replay<\/strong> lets physics determine the state under reference torque plus PD correction. <strong>Validation<\/strong> first evaluates inverse dynamics without stepping time, then runs two actual headless MuJoCo rollouts, with and without feedforward. A 170-interval squat takes 1,700 physics substeps per rollout. No window or real-time pacing is needed.<\/p>\n\n<h3>Fixed task, free joint coordination<\/h3>\n<p>The initial condition is the configured standing pose, lifted until the lowest sole is at ground level, with zero velocities. The initial <em>trajectory guess<\/em> repeats standing at every node with quasi-static torques. These are different concepts: the former is fixed, the latter is what optimization improves.<\/p>\n<p>The default task prescribes 0.5 s stand, 1 s descend, 0.4 s hold, 1 s rise, and 0.5 s stand. Depth, motion durations, and fore–aft CoM shift vary. The joint-angle sequence is not prescribed: the optimizer coordinates the body to track the CoM target while both soles remain constrained.<\/p>\n<p>Each state stores 71 numbers: base position (3), quaternion (4), 29 joint angles, and 35 velocities. Its independent tangent dimension is 70. The default horizon has 171 states and 170 vectors of 29 joint torques; the base has no direct actuator, and contact forces follow from constrained dynamics. Derivative-based backward/forward passes search locally, not by enumerating poses. A nearby standing guess, fixed contacts, smooth target, and posture regularization explain why a shallow squat can converge quickly. Arbitrary-start recovery and global optimality are not established.<\/p>\n\n<div class=\"poc\"><div class=\"kicker\">PoC · reading the 15 cm squat<\/div>\n<p>Three solver iterations took 0.33 s. CoM depth error was 0.3 mm; raw optimizer torque reached 22.08% of its bounds; feet drifted 1.2 mm. CoP violation −24.8 mm means clearance inside the already-inset permitted boundary, not a failure. Friction utilization 0.0091 means 0.91% of modeled capacity. Objective cost is a weighted score, and printed zeros are rounded.<\/p>\n<p style=\"margin-bottom:0\">Feedforward replay tracked the pelvis within 7.7 mm. Leg PD correction was 7.85% of reference RMS torque. Waist correction was 54.12%, but only 0.2712 N m: ratios need absolute magnitudes. PD-only replay fell while joint-angle error remained modest because the floating base can tip with joints near their targets. Negative pelvis height after falling is possible in this foot-only collision scene. The 25.43% effort metric uses interval means; feedforward bypasses actuator clipping, so it is not a substep torque guarantee.<\/p>\n<\/div>\n\n<h3>IK supplies geometry; trajectory optimization supplies dynamics<\/h3>\n<p>Traditional IK asks which configuration puts a hand at a target, possibly subject to joint limits and collision constraints. Trajectory optimization asks how states and controls evolve from the initial state to achieve the task under dynamics and contact assumptions. An IK pose can be reachable yet unbalanced or too demanding in torque; frame-by-frame IK does not establish feasible accelerations. IK is nevertheless a useful source of initial poses or motion guesses.<\/p>\n\n<h3>A vocabulary for new motions<\/h3>\n<p>Define <strong>poses/states<\/strong> for initialization and posture preference; <strong>frame and CoM targets<\/strong> for desired geometry; <strong>contacts<\/strong> for robot–surface relationships; <strong>phases<\/strong> for durations and active targets; <strong>constraints<\/strong> for mandatory conditions; <strong>costs<\/strong> for preferences; and <strong>transitions<\/strong> for liftoff, touchdown, or grasp changes. Object-relative targets such as a palm at a mug's grasp frame generalize better than fixed world coordinates.<\/p>\n<p>A standing reach adds a palm target while retaining both foot contacts. A step changes the contact schedule; pickup adds object dynamics and grasp requirements. A prescribed reach → grasp → lift sequence does not itself solve collision avoidance, balance, or contact feasibility. Discovering the contact strategy is another planning problem.<\/p>\n<p>Pose libraries supply configurations; motion libraries supply paths and initial guesses; task libraries supply parameterized sequences. Retargeting and dynamic validation remain necessary. Our own successful trajectories can seed nearby solves. Concatenating valid clips does not guarantee valid transitions: velocities, contacts, collisions, and torque limits must remain consistent. No external library has been selected here.<\/p>\n\n<h3>Use the references for both learning and testing<\/h3>\n<p>A proposed policy receives current observations plus reference information and emits position offsets from a fixed default pose. PD actuators convert targets to torque. Training samples references and rewards tracking, with perturbations or randomization to practice recovery. Torque may enter observations, critic inputs, and rewards; this differs from injecting it directly as feedforward in today's replay.<\/p>\n<p>Use training trajectories to learn, validation trajectories to choose settings, and held-out test trajectories for final assessment (the existing split is 70/10/20). Evaluate nominal tracking, unseen parameters, perturbed initial states, disturbances, and changed dynamics separately. A reference-conditioned policy generally still needs reference information during execution. Robustness is trained and measured, not automatically conferred by a neural network.<\/p>\n\n<h3>Why not solve online instead?<\/h3>\n<p>That is a valid alternative. <strong>Model predictive control<\/strong> repeatedly solves from the current estimated state, executes a short portion, and replans. A saved reference needs feedback after a push; fixed PD, trajectory-local gains, MPC, and learned tracking are different ways to provide it. The current code uses fixed PD plus feedforward; local optimizer gains and MPC are not implemented as controllers here.<\/p>\n<p>A policy moves work offline and offers cheap, predictable runtime evaluation. Training across relevant variations may teach coordinated corrections. MPC can explicitly accommodate new objectives and constraints but depends on model accuracy and solve deadlines. Either can fail under mismatch, and robust optimization also addresses uncertainty. More compute alone does not fix a bad model.<\/p>\n<p>The 0.33 s offline solve spans 16.5 control intervals at 20 ms. It is not an MPC benchmark: a shorter horizon, warm start from the previous solution, or bounded iteration count changes the problem. Our solver also starts from standing; successful replanning from every viable pose is not established, and pose alone says nothing about recoverability at the current velocity.<\/p>\n<p><strong>The experimental question:<\/strong> does the learned tracker improve tracking or recovery at acceptable runtime cost relative to practical feedback baselines? RL is a hypothesis to test, not an inevitable stage after trajectory optimization.<\/p>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>Distinguish a fixed initial condition from an initial guess for an entire trajectory.<\/li>\n<li>Why can good joint-angle tracking coexist with a fall?<\/li>\n<li>Which new primitives does stepping require beyond a standing reach?<\/li>\n<li>Why do references belong in training, held-out evaluation, and usually runtime inputs?<\/li>\n<li>What would make a comparison between this offline solve, MPC, and a learned policy fair?<\/li><\/ol><\/div>\n<\/section>\n\n<\/doc-page>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\"><\/script>\n\n\n<\/body><\/html>"</script>
