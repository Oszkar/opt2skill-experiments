document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\/style>\n<script src=\"b4aaa154-f5af-479d-8d8d-00155750c1d1\"><\/script>\n<script src=\"bd280c9c-be97-484e-936d-92b0040b9a01\"><\/script>\n<style>\ndoc-page:not(:defined){visibility:hidden}\ndoc-page h1,doc-page h2,doc-page h3{max-width:none;text-wrap:pretty}\ndoc-page h2{font-size:27px;letter-spacing:-0.02em;margin:0 0 10px}\ndoc-page h3{font-size:12px;letter-spacing:0.09em;text-transform:uppercase;margin:20px 0 6px}\ndoc-page p,doc-page li{font-size:14px;line-height:1.6;text-wrap:pretty}\ndoc-page li{margin-bottom:4px}\ndoc-page table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0 14px}\ndoc-page th{text-align:left;font-family:var(--font-heading);font-weight:800;font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;border-bottom:2px solid var(--color-text);padding:6px 8px 6px 0;vertical-align:bottom}\ndoc-page td{border-bottom:1px solid var(--color-divider);padding:6px 8px 6px 0;vertical-align:top;line-height:1.45}\ndoc-page td:last-child,doc-page th:last-child{padding-right:0}\ndoc-page code{font-family:ui-monospace,\"SFMono-Regular\",Menlo,monospace;font-size:0.88em;background:var(--color-neutral-200);padding:0 3px}\ndoc-page figure{break-inside:avoid;margin:14px 0 18px}\ndoc-page figcaption{font-size:11px;line-height:1.45;border-top:1px solid var(--color-divider);padding-top:5px;margin-top:6px;color:var(--color-neutral-700)}\ndoc-page .poc{break-inside:avoid;border-top:2px solid var(--color-accent);padding:8px 0 0;margin:16px 0}\ndoc-page .kicker{font-family:var(--font-heading);font-weight:800;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-700)}\ndoc-page .cy{break-inside:avoid;border-top:2px solid var(--color-text);margin-top:20px;padding-top:8px}\ndoc-page .cy ol{font-size:13px;color:var(--color-accent-700);margin:0;padding-left:1.2em}\ndoc-page pre{font-family:ui-monospace,\"SFMono-Regular\",Menlo,monospace;font-size:10.4px;line-height:1.5;background:var(--color-neutral-100);border-top:2px solid var(--color-text);border-bottom:1px solid var(--color-divider);padding:10px 12px;margin:10px 0 14px;white-space:pre;overflow:hidden;break-inside:avoid;tab-size:4}\ndoc-page pre b{color:var(--color-accent-700);font-weight:800}\ndoc-page pre i{color:var(--color-neutral-700);font-style:normal}\ndoc-page .n{display:inline-block;min-width:15px;height:15px;line-height:15px;text-align:center;background:var(--color-accent);color:#fff;font-family:var(--font-heading);font-size:9.5px;font-weight:800;vertical-align:2px;margin:0 3px 0 1px}\ndoc-page .eq{border-top:2px solid var(--color-text);border-bottom:2px solid var(--color-text);padding:14px 0 12px;margin:12px 0 4px;break-inside:avoid}\ndoc-page .eqline{font-family:var(--font-heading);font-weight:800;font-size:19px;letter-spacing:-0.01em;line-height:1.6}\ndoc-page .eqsub{font-family:ui-monospace,\"SFMono-Regular\",Menlo,monospace;font-size:11.5px;line-height:1.7;margin-top:4px;color:var(--color-neutral-700)}\ndoc-page .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px;margin-top:12px;font-size:11px;line-height:1.45}\ndoc-page .legend strong{font-family:var(--font-heading);font-weight:800}\ndoc-page section{break-before:page}\ndoc-page section:first-of-type{break-before:auto}\n\n/* Keep flowing study notes inside the printable page width. */\ndoc-page figure, doc-page section, doc-page .eq { min-width: 0; max-width: 100%; }\ndoc-page p, doc-page li, doc-page .eqline, doc-page .eqsub { overflow-wrap: anywhere; }\ndoc-page pre { white-space: pre-wrap; overflow-wrap: anywhere; overflow: visible; }\ndoc-page .legend { grid-template-columns: repeat(3, minmax(0, 1fr)); }\ndoc-page .legend > *, doc-page > div > div { min-width: 0; }\ndoc-page svg { display: block; max-width: 100%; height: auto; }\ndoc-page > div:first-child { flex-wrap: wrap; gap: 4px 16px; }\n<\/style>\n<\/helmet>\n\n<doc-page margin=\"0.75in\">\n\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--color-text);padding-bottom:6px\">\n<span style=\"font-family:var(--font-heading);font-weight:800;font-size:11px;letter-spacing:0.1em;text-transform:uppercase\">Study booklet<\/span>\n<span style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700)\">arXiv 2409.20514v6 · 1 Oct 2025 · expanded with MuJoCo, PPO &amp; control-design notes<\/span>\n<\/div>\n\n<h1 style=\"font-size:44px;line-height:1.03;margin:18px 0 10px\">Opt2Skill: imitating dynamically-feasible whole-body trajectories<\/h1>\n\n<p style=\"font-size:16.5px;line-height:1.5;margin-bottom:16px\">Liu et al. train humanoid loco-manipulation policies by tracking references produced by <strong>model-based trajectory optimization<\/strong> rather than by motion capture or inverse kinematics — and by tracking the <strong>torques and contact forces<\/strong> those references carry, not only the poses.<\/p>\n\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--color-text);border-bottom:2px solid var(--color-text);margin-bottom:18px\">\n<div style=\"padding:10px 14px 10px 0;border-right:1px solid var(--color-divider)\"><div class=\"kicker\">Read for<\/div><div style=\"font-size:12.5px;line-height:1.45;margin-top:3px\">Defending and critiquing the method; re-deriving it well enough to reimplement.<\/div><\/div>\n<div style=\"padding:10px 14px;border-right:1px solid var(--color-divider)\"><div class=\"kicker\">Assumes<\/div><div style=\"font-size:12.5px;line-height:1.45;margin-top:3px\">Senior software engineer; dormant university ML/RL, robotics and control.<\/div><\/div>\n<div style=\"padding:10px 0 10px 14px\"><div class=\"kicker\">Worked example<\/div><div style=\"font-size:12.5px;line-height:1.45;margin-top:3px\">Your Unitree&nbsp;G1 squat PoC, in the red-ruled <em>PoC<\/em> blocks.<\/div><\/div>\n<\/div>\n\n<p class=\"poc\"><strong>Reading scope, corrected 8 September 2026.<\/strong> Paper facts refer to arXiv v6. G1 dimensions, BoxFDDP, barriers, filtering and replay results are our implementation/example, not Digit measurements. Recorded project results below are retained as historical notes, not revalidated experiments. Explanations and extension ideas are identified separately.<\/p>\n<h3 style=\"margin-top:0\" data-comment-anchor=\"81f43e4c05-h3\">The one-sentence version<\/h3>\n<p style=\"font-size:15.5px;border-top:2px solid var(--color-accent);border-bottom:2px solid var(--color-accent);padding:12px 0;margin-bottom:0\"><strong>Kinematic plausibility does not guarantee dynamic feasibility.<\/strong> Generate references from a full-order optimal-control problem that already respects dynamics, torque limits and friction cones — then tell the policy not only <em>where to be<\/em> but <em>how hard to push<\/em>.<\/p>\n\n<section>\n<div class=\"kicker\">Section 1<\/div>\n<h2>The claim, and the gap it fills<\/h2>\n\n<p>Reference-tracking policies require motion references. Opt2Skill compares optimized references with retargeted human and IK references. Its results support full-body dynamic consistency and torque/force supervision in the evaluated tasks; they do not establish that optimization dominates every alternative on every metric.<\/p>\n\n<figure>\n<svg sc-camel-view-box=\"0 0 672 176\" width=\"100%\" role=\"img\" aria-label=\"Three reference sources compared on kinematic fit, dynamic feasibility and effort annotation\">\n<g font-family=\"Archivo, sans-serif\">\n<line x1=\"0\" y1=\"2\" x2=\"672\" y2=\"2\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<g font-size=\"12\" font-weight=\"800\" letter-spacing=\"0.05em\" fill=\"#201e1d\">\n<text x=\"0\" y=\"26\">HUMAN MOCAP, RETARGETED<\/text>\n<text x=\"0\" y=\"78\">INVERSE KINEMATICS<\/text>\n<text x=\"0\" y=\"130\">TRAJECTORY OPTIMIZATION<\/text>\n<\/g>\n<g font-size=\"11\" fill=\"#605d5d\">\n<text x=\"0\" y=\"44\">Human morphology; no robot dynamics; no effort<\/text>\n<text x=\"0\" y=\"96\">Exact poses; dynamically silent; no effort<\/text>\n<\/g>\n<text x=\"0\" y=\"148\" font-size=\"11\" fill=\"#ae1800\">Full-order dynamics, contact and limits — torque and force fall out for free<\/text>\n<g>\n<rect x=\"392\" y=\"14\" width=\"60\" height=\"13\" fill=\"#d7d3d3\" data-comment-anchor=\"c661d1ec77-rect\"><\/rect><rect x=\"392\" y=\"14\" width=\"40\" height=\"13\" fill=\"#201e1d\"><\/rect>\n<rect x=\"472\" y=\"14\" width=\"60\" height=\"13\" fill=\"#d7d3d3\"><\/rect><rect x=\"472\" y=\"14\" width=\"8\" height=\"13\" fill=\"#201e1d\"><\/rect>\n<rect x=\"552\" y=\"14\" width=\"60\" height=\"13\" fill=\"#d7d3d3\"><\/rect>\n<rect x=\"392\" y=\"66\" width=\"60\" height=\"13\" fill=\"#d7d3d3\"><\/rect><rect x=\"392\" y=\"66\" width=\"58\" height=\"13\" fill=\"#201e1d\"><\/rect>\n<rect x=\"472\" y=\"66\" width=\"60\" height=\"13\" fill=\"#d7d3d3\"><\/rect><rect x=\"472\" y=\"66\" width=\"14\" height=\"13\" fill=\"#201e1d\"><\/rect>\n<rect x=\"552\" y=\"66\" width=\"60\" height=\"13\" fill=\"#d7d3d3\"><\/rect>\n<rect x=\"392\" y=\"118\" width=\"60\" height=\"13\" fill=\"#ffc4b8\"><\/rect><rect x=\"392\" y=\"118\" width=\"48\" height=\"13\" fill=\"#ec3013\"><\/rect>\n<rect x=\"472\" y=\"118\" width=\"60\" height=\"13\" fill=\"#ffc4b8\"><\/rect><rect x=\"472\" y=\"118\" width=\"58\" height=\"13\" fill=\"#ec3013\"><\/rect>\n<rect x=\"552\" y=\"118\" width=\"60\" height=\"13\" fill=\"#ffc4b8\"><\/rect><rect x=\"552\" y=\"118\" width=\"60\" height=\"13\" fill=\"#ec3013\"><\/rect>\n<\/g>\n<g font-size=\"8.5\" font-weight=\"800\" letter-spacing=\"0.04em\" fill=\"#605d5d\">\n<text x=\"392\" y=\"150\">KINEMATIC<\/text><text x=\"392\" y=\"161\">FIT<\/text>\n<text x=\"472\" y=\"150\">DYNAMIC<\/text><text x=\"472\" y=\"161\">FEASIBILITY<\/text>\n<text x=\"552\" y=\"150\" data-comment-anchor=\"fcaa517cbe-text\">EFFORT<\/text><text x=\"552\" y=\"161\">ANNOTATION<\/text>\n<\/g>\n<line x1=\"0\" y1=\"172\" x2=\"672\" y2=\"172\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<\/g>\n<\/svg>\n<figcaption data-comment-anchor=\"b79783a9f7-figcaption\">Fig. 1 — These bars are qualitative illustrations, not measured scores. Mocap and IK do not inherently provide effort channels or enforce the robot’s dynamics; some resulting motions can still be feasible. IK achieved lower joint-angle tracking error in the reported comparison, while TO performed better on several task-space and drift metrics. This is not a universal ranking of geometric quality.<\/figcaption>\n<\/figure>\n\n<h3>The pipeline<\/h3>\n\n<figure>\n<svg sc-camel-view-box=\"0 0 672 130\" width=\"100%\" role=\"img\" aria-label=\"Opt2Skill pipeline from task specification to hardware\">\n<g font-family=\"Archivo, sans-serif\">\n<g fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2\">\n<rect x=\"0\" y=\"28\" width=\"118\" height=\"58\"><\/rect><rect x=\"136\" y=\"28\" width=\"142\" height=\"58\"><\/rect><rect x=\"296\" y=\"28\" width=\"142\" height=\"58\"><\/rect><rect x=\"456\" y=\"28\" width=\"98\" height=\"58\"><\/rect><rect x=\"572\" y=\"28\" width=\"100\" height=\"58\"><\/rect>\n<\/g>\n<rect x=\"296\" y=\"28\" width=\"142\" height=\"4\" fill=\"#ec3013\"><\/rect><rect x=\"456\" y=\"28\" width=\"98\" height=\"4\" fill=\"#ec3013\"><\/rect>\n<g font-size=\"11.5\" font-weight=\"800\" fill=\"#201e1d\">\n<text x=\"12\" y=\"54\">Task spec<\/text><text x=\"150\" y=\"54\">Trajectory opt.<\/text><text x=\"308\" y=\"54\">Reference dataset<\/text><text x=\"468\" y=\"54\">PPO tracker<\/text><text x=\"584\" y=\"54\">Hardware<\/text>\n<\/g>\n<g font-size=\"10\" fill=\"#605d5d\">\n<text x=\"12\" y=\"70\">outputs ŷ,<\/text><text x=\"12\" y=\"82\">contact schedule<\/text>\n<text x=\"150\" y=\"70\">DDP · Crocoddyl<\/text><text x=\"150\" y=\"82\">+ Pinocchio<\/text>\n<text x=\"308\" y=\"70\">&gt;1000 per task,<\/text><text x=\"308\" y=\"82\">randomized<\/text>\n<text x=\"468\" y=\"70\">asymmetric<\/text><text x=\"468\" y=\"82\">actor-critic<\/text>\n<text x=\"584\" y=\"70\">Digit,<\/text><text x=\"584\" y=\"82\">sim-to-real<\/text>\n<\/g>\n<g stroke=\"#201e1d\" stroke-width=\"2\"><path d=\"M118 57 h11 M278 57 h11 M438 57 h11 M554 57 h11\"><\/path><\/g>\n<g fill=\"#201e1d\"><path d=\"M136 57 l-8 -4 v8 z\"><\/path><path d=\"M296 57 l-8 -4 v8 z\"><\/path><path d=\"M456 57 l-8 -4 v8 z\"><\/path><path d=\"M572 57 l-8 -4 v8 z\"><\/path><\/g>\n<text x=\"296\" y=\"18\" font-size=\"9.5\" font-weight=\"800\" letter-spacing=\"0.07em\" fill=\"#ae1800\">CARRIES q, q̇, EE POS, JOINT TORQUE, CONTACT FORCE<\/text>\n<line x1=\"0\" y1=\"106\" x2=\"672\" y2=\"106\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<text x=\"0\" y=\"122\" font-size=\"10\" fill=\"#605d5d\">Offline · seconds to minutes per trajectory<\/text>\n<text x=\"456\" y=\"122\" font-size=\"10\" fill=\"#605d5d\">Online · 200 Hz policy, 2 kHz PD<\/text>\n<\/g>\n<\/svg>\n<figcaption>Fig. 2 — The red band is the contribution. Torque and contact force survive the handoff from optimizer to learner: they appear in the stored dataset, in the observation vector, and in the reward.<\/figcaption>\n<\/figure>\n\n<h3>What is <em>not<\/em> new here<\/h3>\n<p>Tracking a reference with RL is DeepMimic, 2018. Using optimal-control references instead of mocap is OPT-Mimic (quadruped) and MIMOC (Mini Cheetah, MIT Humanoid in sim). What is new is the combination at full humanoid scale on hardware, with loco-<em>manipulation<\/em> tasks, and the controlled ablation isolating what the torque and force channels are worth. See section 10 for the lineage.<\/p>\n\n<div class=\"poc\">\n<div class=\"kicker\">PoC · your G1 squat<\/div>\n<p style=\"margin-bottom:0\">Your pipeline is this graph with the last two boxes empty. <code>profile.py<\/code> is the task spec, <code>squat_problem.py<\/code> the OCP, <code>export.py<\/code> + <code>filter.py<\/code> the dataset stage, and the tracker is plan 2. Fixed two-foot contact is a good learning scope: whole-body dynamics without footstep scheduling or impact dynamics.<\/p>\n<\/div>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>Why does the IK baseline win on joint error and lose on task-space error?<\/li>\n<li>Which two quantities cross the optimizer-to-policy boundary here that do not cross it in DeepMimic-style work?<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 2<\/div>\n<h2>Notation, and the traps hiding inside it<\/h2>\n\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:20%\">Symbol<\/sc-raw-th><sc-raw-th style=\"width:33%\">Is<\/sc-raw-th><sc-raw-th>The trap<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><code>q<\/code> — configuration<\/sc-raw-td><sc-raw-td>Base position (3) + base quaternion (4) + joint angles<\/sc-raw-td><sc-raw-td>Lives on a manifold, not a vector space. Subtracting or averaging two <code>q<\/code>s is wrong; you need a tangent-space difference.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>v<\/code> — velocity<\/sc-raw-td><sc-raw-td>Base twist (6) + joint rates<\/sc-raw-td><sc-raw-td>One shorter than <code>q<\/code>: three rotational DoF, four quaternion numbers. Its frame convention differs per library.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>x = (q, v)<\/code><\/sc-raw-td><sc-raw-td>The OCP state<\/sc-raw-td><sc-raw-td>Integrated with manifold <code>integrate<\/code>/<code>difference<\/code>, never with <code>+<\/code> and <code>−<\/code>.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>M(q)<\/code><\/sc-raw-td><sc-raw-td>Mass matrix: inertia and inter-joint coupling<\/sc-raw-td><sc-raw-td>Configuration-dependent. Swinging an arm changes the dynamics felt at the ankle — that is what \"whole-body\" means concretely.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>h(q, v)<\/code><\/sc-raw-td><sc-raw-td>Bias: gravity, Coriolis, centrifugal<\/sc-raw-td><sc-raw-td>Sometimes written <code>C(q,v)v + g(q)<\/code>. Same object.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>B<\/code><\/sc-raw-td><sc-raw-td>Actuation selection matrix<\/sc-raw-td><sc-raw-td>Its first six rows are zero. That is underactuation, written as a matrix.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>J_c(q)<\/code><\/sc-raw-td><sc-raw-td>Contact Jacobian<\/sc-raw-td><sc-raw-td><code>J<\/code> maps generalized velocity → task-space velocity; <code>Jᵀ<\/code> maps task-space force → generalized force. Mixing them up is the commonest shape/sign bug in the field.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>f_c<\/code> — wrench<\/sc-raw-td><sc-raw-td>Force (3) + moment (3)<\/sc-raw-td><sc-raw-td>Meaningless without both an axis convention <em>and<\/em> an origin. Move the reference point and the moment changes by a lever-arm cross product.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>τ<\/code> / <code>u<\/code><\/sc-raw-td><sc-raw-td>Joint torque / the OCP control<\/sc-raw-td><sc-raw-td>Equal only if the model has no passive damping. Most simulators have it (section 6).<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>CoM<\/sc-raw-td><sc-raw-td>Center of mass of the whole robot<\/sc-raw-td><sc-raw-td>Not the pelvis and not the base frame. Squat depth is a CoM drop.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>CoP<\/sc-raw-td><sc-raw-td>Center of pressure under a foot<\/sc-raw-td><sc-raw-td>Inside the sole polygon ⇒ flat-foot support is plausible. On the edge ⇒ the foot is about to rotate.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Friction cone<\/sc-raw-td><sc-raw-td>|f_t| ≤ μ·f_n<\/sc-raw-td><sc-raw-td>Usually linearised to a pyramid or smoothed into a barrier cost so a solver can eat it.<\/sc-raw-td><\/sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Armature<\/sc-raw-td><sc-raw-td>Reflected rotor inertia<\/sc-raw-td><sc-raw-td>Distinct from joint damping and from dry friction loss. Three effects, three places they silently go missing between two models.<\/sc-raw-td><\/sc-raw-tr>\n<\/sc-raw-tbody>\n<\/sc-raw-table>\n\n<h3>The equation to become fluent in<\/h3>\n<figure>\n<div style=\"border-top:2px solid var(--color-text);border-bottom:2px solid var(--color-text);padding:16px 0;text-align:left\">\n<div style=\"font-family:var(--font-heading);font-weight:800;font-size:28px;letter-spacing:-0.01em\">M(q)&nbsp;v̇ &nbsp;+&nbsp; h(q,&nbsp;v) &nbsp;=&nbsp; B&nbsp;τ &nbsp;+&nbsp; J<sub style=\"font-size:0.6em\">c<\/sub>(q)<sup style=\"font-size:0.6em\">⊤<\/sup>&nbsp;f<sub style=\"font-size:0.6em\">c<\/sub><\/div>\n<div style=\"display:grid;grid-template-columns:1.1fr 1.6fr 1fr 2fr;gap:0;margin-top:14px;font-size:11px;line-height:1.4\">\n<div style=\"padding-right:12px;border-right:1px solid var(--color-divider)\"><span class=\"kicker\">Inertia<\/span><br>What resists acceleration.<\/div>\n<div style=\"padding:0 12px;border-right:1px solid var(--color-divider)\"><span class=\"kicker\">Bias<\/span><br>Gravity and velocity-product terms.<\/div>\n<div style=\"padding:0 12px;border-right:1px solid var(--color-divider)\"><span class=\"kicker\">Actuation<\/span><br>G1 PoC: 29 motors; base unactuated.<\/div>\n<div style=\"padding-left:12px\"><span class=\"kicker\">Contact<\/span><br>External contact wrenches affect whole-system momentum. Internal joint motion can also change base orientation. Read the unactuated rows as a dynamics-consistency check.<\/div>\n<\/div>\n<\/div>\n<figcaption>Fig. 3 — Inertia plus bias must balance actuation plus contact. The top six (unactuated) rows are the useful diagnostic: if a reference motion's base rows don't balance with plausible contact forces, that motion is fiction, whatever the pose sequence looks like.<\/figcaption>\n<\/figure>\n\n<div class=\"poc\">\n<div class=\"kicker\">PoC · your G1 squat<\/div>\n<p style=\"margin-bottom:0\">Your <code>q<\/code> has 36 entries, <code>v<\/code> has 35 (29 joints + floating base). Your validation check 1 is literally the base-rows test above: apply the reference foot wrenches, ask MuJoCo's inverse dynamics what generalized force the recorded acceleration required, and demand the base residual be ≈0 (measured: 0.38&nbsp;N / 0.00&nbsp;N·m) and the joint residual match the recorded torque (rms 0.0007&nbsp;N·m against a 5.8&nbsp;N·m reference).<\/p>\n<\/div>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>Why is <code>v<\/code> one entry shorter than <code>q<\/code>, and what breaks if you ignore that?<\/li>\n<li>What, physically, do the first six rows of the equation of motion assert?<\/li>\n<li>You are handed a wrench vector of six numbers. What two further facts do you need before it means anything?<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 3<\/div>\n<h2 data-comment-anchor=\"4f222697ee-h2\" style=\"position: static\">The optimal control problem, and what it actually enforces<\/h2>\n\n<p>Trajectory optimization here means: pick a state sequence <code>x[0..N]<\/code> and control sequence <code>u[0..N-1]<\/code> that minimize a summed cost subject to the dynamics and a set of constraints. Three things go in — a model, a task, a contact schedule — and states, torques and contact wrenches come out.<\/p>\n\n<h3>What the paper puts in the problem<\/h3>\n<ul style=\"margin:0 0 12px;padding-left:1.15em\">\n<li><strong>Full-order floating-base dynamics<\/strong> via Pinocchio, not a centroidal or LIP reduction. This is the expensive choice and the one that makes the output torques trustworthy.<\/li>\n<li><strong>Rigid contact constraints<\/strong>: the contact frame's acceleration is held at zero. Solving the resulting KKT system yields the accelerations <em>and<\/em> the contact forces together — which is why forces are available as both cost terms and exported references.<\/li>\n<li><strong>Impact dynamics<\/strong> at touchdown: a velocity jump satisfying <code>M(v⁺ − v⁻) = Jᵀ Λ<\/code>. Needed for walking and stairs; irrelevant for a fixed-contact squat.<\/li>\n<li><strong>Joint and torque limits and friction-cone constraints<\/strong> in the paper’s formulation (2d–2e). Their numerical enforcement must be distinguished from our implementation’s soft barriers.<\/li>\n<li><strong>A predefined contact schedule<\/strong> — which foot is down when. This is an input, not an output. The optimizer never decides to take a step.<\/li>\n<li><strong>Task-space outputs ŷ<\/strong>: dense end-effector tracking for walking and stairs, sparse subgoals for pickup and desk tasks.<\/li>\n<\/ul>\n\n<h3>The three tiers of \"requirement\"<\/h3>\n<p>The following three-tier classification describes our G1 BoxFDDP implementation. The paper specifies DDP in Crocoddyl and writes limits and friction as constraints; it does not document this exact barrier/filter implementation.<\/p>\n\n<figure>\n<svg sc-camel-view-box=\"0 0 672 168\" width=\"100%\" role=\"img\" aria-label=\"Three tiers: enforced by dynamics, hard bounds, and soft costs\">\n<g font-family=\"Archivo, sans-serif\">\n<g fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2\"><rect x=\"0\" y=\"18\" width=\"214\" height=\"124\"><\/rect><rect x=\"229\" y=\"18\" width=\"214\" height=\"124\"><\/rect><rect x=\"458\" y=\"18\" width=\"214\" height=\"124\"><\/rect><\/g>\n<rect x=\"0\" y=\"18\" width=\"214\" height=\"5\" fill=\"#201e1d\"><\/rect><rect x=\"229\" y=\"18\" width=\"214\" height=\"5\" fill=\"#201e1d\"><\/rect><rect x=\"458\" y=\"18\" width=\"214\" height=\"5\" fill=\"#ec3013\"><\/rect>\n<g font-size=\"13\" font-weight=\"800\" fill=\"#201e1d\"><text x=\"14\" y=\"48\">STRUCTURAL<\/text><text x=\"243\" y=\"48\">HARD BOUND<\/text><text x=\"472\" y=\"48\">SOFT COST<\/text><\/g>\n<g font-size=\"11\" fill=\"#201e1d\">\n<text x=\"14\" y=\"70\">Enforced to tolerance:<\/text><text x=\"14\" y=\"86\">it is the dynamics.<\/text>\n<text x=\"243\" y=\"70\">Solver refuses to<\/text><text x=\"243\" y=\"86\">leave the box.<\/text>\n<text x=\"472\" y=\"70\">Violation is merely<\/text><text x=\"472\" y=\"86\">expensive.<\/text>\n<\/g>\n<g font-size=\"10.5\" fill=\"#605d5d\">\n<text x=\"14\" y=\"110\">Newton–Euler balance,<\/text><text x=\"14\" y=\"124\">contact frame fixed,<\/text><text x=\"14\" y=\"138\">manifold integration<\/text>\n<text x=\"243\" y=\"110\">torque box (BoxFDDP),<\/text><text x=\"243\" y=\"124\">— and, if you skip it,<\/text><text x=\"243\" y=\"138\">nothing else<\/text>\n<text x=\"472\" y=\"110\">CoM target, posture reg,<\/text><text x=\"472\" y=\"124\">friction cone, CoP,<\/text><text x=\"472\" y=\"138\">joint-limit barrier<\/text>\n<\/g>\n<text x=\"0\" y=\"162\" font-size=\"10.5\" fill=\"#ae1800\">Weights only order the third column against itself. A cost is a preference, never a guarantee.<\/text>\n<\/g>\n<\/svg>\n<figcaption>Fig. 4 — In our implementation, dynamics residuals call for checking discretization, solver convergence, and model consistency. A hard-bound violation makes a candidate unacceptable; failure of a local solve is not proof of physical infeasibility. Soft-cost violations require evaluating the tradeoff or enforcing a constraint.<\/figcaption>\n<\/figure>\n\n\n<h3>The cost, term by term<\/h3>\n<p>The detailed cost below is our G1 squat example, not a transcription of paper equation 2a. Weights encode both scaling and relative priorities; interpreting them requires the units, dimensions, and typical magnitudes of each residual.<\/p>\n<figure>\n<div class=\"eq\">\n<div class=\"eqline\">J = Σ<sub style=\"font-size:.6em\">k<\/sub> [ <span class=\"n\">1<\/span>w<sub style=\"font-size:.6em\">c<\/sub>‖c(q<sub style=\"font-size:.6em\">k<\/sub>) − c*<sub style=\"font-size:.6em\">k<\/sub>‖² + <span class=\"n\">2<\/span>‖x<sub style=\"font-size:.6em\">k<\/sub> ⊖ x<sub style=\"font-size:.6em\">ref<\/sub>‖²<sub style=\"font-size:.6em\">Q<\/sub> + <span class=\"n\">3<\/span>w<sub style=\"font-size:.6em\">u<\/sub>‖u<sub style=\"font-size:.6em\">k<\/sub>‖² + <span class=\"n\">4<\/span>B(q<sub style=\"font-size:.6em\">k<\/sub>) + <span class=\"n\">5<\/span>W(f<sub style=\"font-size:.6em\">k<\/sub>) ] Δt + <span class=\"n\">6<\/span>ℓ<sub style=\"font-size:.6em\">N<\/sub>(x<sub style=\"font-size:.6em\">N<\/sub>)<\/div>\n<div class=\"eqsub\">subject to&nbsp; x[k+1] = F(x[k], u[k])&nbsp; (structural) &nbsp;·&nbsp; u_min ≤ u[k] ≤ u_max&nbsp; (hard box) &nbsp;·&nbsp; f[k] is <em>not<\/em> a decision variable — it falls out of F<\/div>\n<div class=\"legend\">\n<div><span class=\"n\">1<\/span><strong>CoM tracking — the task.<\/strong><br>c(q) from forward kinematics and link masses. Units m². A 1 cm miss is 1e-4 m²; at w<sub>c<\/sub> = 1e5 that costs 10 units per node.<\/div>\n<div><span class=\"n\">2<\/span><strong>State regularization.<\/strong><br>⊖ is the tangent-space difference, never a minus. Q weights posture and velocity separately; it is what the CoM term has to out-bid.<\/div>\n<div><span class=\"n\">3<\/span><strong>Control regularization.<\/strong><br>u in N·m, typically 10–100, so ‖u‖² ≈ 1e3–1e4 per node; at w<sub>u<\/sub> = 1e-3 that is 1–10 units — the same order as a 1 cm CoM miss. That coincidence is the whole story of section 3's PoC.<\/div>\n<div><span class=\"n\">4<\/span><strong>Joint-limit barrier.<\/strong><br>Quadratic-barrier activation: exactly zero while inside (limit − margin), quadratic once outside. Weight 1e5 increases the penalty; it does not guarantee satisfaction.<\/div>\n<div><span class=\"n\">5<\/span><strong>Wrench-cone residual.<\/strong><br>Friction pyramid, CoP box and f<sub>z<\/sub> bounds stacked as one residual with a \"zero inside the cone\" activation. Note it penalises a quantity the solver only sees <em>through<\/em> the dynamics.<\/div>\n<div><span class=\"n\">6<\/span><strong>Terminal cost.<\/strong><br>Rest: velocity to zero, posture back to stand. No control term — there is no u<sub>N<\/sub>.<\/div>\n<\/div>\n<\/div>\n<figcaption>Fig. 5 — Terms <span class=\"n\">1<\/span>–<span class=\"n\">6<\/span> are all tier three (soft). The dynamics constraint is tier one and the torque box is tier two; everything else, including the friction cone, is a preference the solver may trade away — which is why the generator re-checks it (section 5).<\/figcaption>\n<\/figure>\n\n<h3>Where the contact force comes from<\/h3>\n<p>Rigid contact turns the forward dynamics at each node into a small saddle-point system. Solving it gives accelerations and contact forces <em>together<\/em> — the forces are Lagrange multipliers, which is why they exist to be penalised in <span class=\"n\">5<\/span> and exported afterwards.<\/p>\n<figure>\n<div class=\"eq\">\n<div class=\"eqline\" style=\"font-size:20px\">\n<span style=\"display:inline-grid;grid-template-columns:auto auto;column-gap:14px;vertical-align:middle;border-left:2px solid var(--color-text);border-right:2px solid var(--color-text);padding:2px 8px\"><span><span class=\"n\">1<\/span>M(q)<\/span><span>J<sub style=\"font-size:.6em\">c<\/sub>ᵀ<\/span><span><span class=\"n\">2<\/span>J<sub style=\"font-size:.6em\">c<\/sub><\/span><span>0<\/span><\/span>\n<span style=\"display:inline-grid;vertical-align:middle;border-left:2px solid var(--color-text);border-right:2px solid var(--color-text);padding:2px 8px;margin-left:6px\"><span>v̇<\/span><span>−f<sub style=\"font-size:.6em\">c<\/sub><\/span><\/span>\n&nbsp;=&nbsp;\n<span style=\"display:inline-grid;vertical-align:middle;border-left:2px solid var(--color-text);border-right:2px solid var(--color-text);padding:2px 8px\"><span>Bu − h(q, v)<\/span><span>−J̇<sub style=\"font-size:.6em\">c<\/sub>v − <span class=\"n\">3<\/span>a<sub style=\"font-size:.6em\">B<\/sub><\/span><\/span>\n<\/div>\n<div class=\"eqsub\">a_B = 2ζω · (J_c v) + ω² · e_pos &nbsp;·&nbsp; Baumgarte gains (K_p, K_d) = (ω², 2ζω) — your (100, 20)<\/div>\n<div class=\"legend\">\n<div><span class=\"n\">1<\/span><strong>Top block rows.<\/strong><br>Newton–Euler from Fig. 3, with the unknown contact force moved to the left. Same equation, now solved for two unknowns.<\/div>\n<div><span class=\"n\">2<\/span><strong>Bottom block rows.<\/strong><br>\"The contact frame does not accelerate\": J<sub>c<\/sub>v̇ + J̇<sub>c<\/sub>v = 0. Six rows per foot for a 6D contact — hence a 6D wrench, not a 3D force.<\/div>\n<div><span class=\"n\">3<\/span><strong>Baumgarte term.<\/strong><br>Integration lets the frame drift; a<sub>B<\/sub> asks for a small corrective acceleration proportional to the drift and its rate. Pure stabilisation — it has no physical counterpart, which is why residual drift is an integrator property, not a bug (section 4).<\/div>\n<\/div>\n<\/div>\n<figcaption>Fig. 6 — For given state and actuator torque, the contact dynamics solve yields acceleration and contact wrench. With positive-definite M, nonsingularity requires J_c to have full row rank. Twelve rows on a 35-dimensional velocity space do not prove independence; redundant contacts require special treatment. Sticking assumes consistent initial contact position and velocity. Constrain only the appropriate directions for sliding tasks such as wiping.<\/figcaption>\n<\/figure>\n\n<h3>What the centre of mass is asked to do<\/h3>\n<figure>\n<svg sc-camel-view-box=\"0 0 672 196\" width=\"100%\" role=\"img\" aria-label=\"CoM height target over time: stand, minimum-jerk descent, hold, ascent, stand\">\n<g font-family=\"Archivo, sans-serif\">\n<g stroke=\"#d7d3d3\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><path d=\"M139.4 16 V138 M298.2 16 V138 M361.8 16 V138 M520.6 16 V138\"><\/path><\/g>\n<path d=\"M60 20 H600\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\/path><path d=\"M60 130 H600\" stroke=\"#d7d3d3\" stroke-width=\"1\"><\/path>\n<g stroke=\"#201e1d\" stroke-width=\"1.5\"><path d=\"M60 138 H600 M60 138 V14\"><\/path><\/g>\n<path d=\"M60,20 L63.2,20 L66.4,20 L69.5,20 L72.7,20 L75.9,20 L79.1,20 L82.2,20 L85.4,20 L88.6,20 L91.8,20 L94.9,20 L98.1,20 L101.3,20 L104.5,20 L107.6,20 L110.8,20 L114,20 L117.2,20 L120.4,20 L123.5,20 L126.7,20 L129.9,20 L133.1,20 L136.2,20 L139.4,20 L142.6,20 L145.8,20.1 L148.9,20.2 L152.1,20.5 L155.3,20.9 L158.5,21.6 L161.6,22.4 L164.8,23.5 L168,24.8 L171.2,26.4 L174.4,28.2 L177.5,30.3 L180.7,32.6 L183.9,35.1 L187.1,37.9 L190.2,41 L193.4,44.2 L196.6,47.6 L199.8,51.2 L202.9,54.9 L206.1,58.8 L209.3,62.7 L212.5,66.8 L215.6,70.9 L218.8,75 L222,79.1 L225.2,83.2 L228.4,87.3 L231.5,91.2 L234.7,95.1 L237.9,98.8 L241.1,102.4 L244.2,105.8 L247.4,109 L250.6,112.1 L253.8,114.9 L256.9,117.4 L260.1,119.7 L263.3,121.8 L266.5,123.6 L269.6,125.2 L272.8,126.5 L276,127.6 L279.2,128.4 L282.4,129.1 L285.5,129.5 L288.7,129.8 L291.9,129.9 L295.1,130 L298.2,130 L301.4,130 L304.6,130 L307.8,130 L310.9,130 L314.1,130 L317.3,130 L320.5,130 L323.6,130 L326.8,130 L330,130 L333.2,130 L336.4,130 L339.5,130 L342.7,130 L345.9,130 L349.1,130 L352.2,130 L355.4,130 L358.6,130 L361.8,130 L364.9,130 L368.1,129.9 L371.3,129.8 L374.5,129.5 L377.6,129.1 L380.8,128.4 L384,127.6 L387.2,126.5 L390.4,125.2 L393.5,123.6 L396.7,121.8 L399.9,119.7 L403.1,117.4 L406.2,114.9 L409.4,112.1 L412.6,109 L415.8,105.8 L418.9,102.4 L422.1,98.8 L425.3,95.1 L428.5,91.2 L431.6,87.3 L434.8,83.2 L438,79.1 L441.2,75 L444.4,70.9 L447.5,66.8 L450.7,62.7 L453.9,58.8 L457.1,54.9 L460.2,51.2 L463.4,47.6 L466.6,44.2 L469.8,41 L472.9,37.9 L476.1,35.1 L479.3,32.6 L482.5,30.3 L485.6,28.2 L488.8,26.4 L492,24.8 L495.2,23.5 L498.4,22.4 L501.5,21.6 L504.7,20.9 L507.9,20.5 L511.1,20.2 L514.2,20.1 L517.4,20 L520.6,20 L523.8,20 L526.9,20 L530.1,20 L533.3,20 L536.5,20 L539.6,20 L542.8,20 L546,20 L549.2,20 L552.4,20 L555.5,20 L558.7,20 L561.9,20 L565.1,20 L568.2,20 L571.4,20 L574.6,20 L577.8,20 L580.9,20 L584.1,20 L587.3,20 L590.5,20 L593.6,20 L596.8,20 L600,20\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\/path>\n<path d=\"M298.2,130 L361.8,130\" fill=\"none\" stroke=\"#ec3013\" stroke-width=\"3.5\"><\/path>\n<g font-size=\"10\" fill=\"#201e1d\"><text x=\"0\" y=\"24\">0.72 m<\/text><text x=\"0\" y=\"134\">0.52 m<\/text><\/g>\n<g font-size=\"9.5\" fill=\"#605d5d\" text-anchor=\"middle\"><text x=\"60\" y=\"152\">0<\/text><text x=\"139.4\" y=\"152\">0.5<\/text><text x=\"298.2\" y=\"152\">1.5<\/text><text x=\"361.8\" y=\"152\">1.9<\/text><text x=\"520.6\" y=\"152\">2.9<\/text><text x=\"600\" y=\"152\">3.4 s<\/text><\/g>\n<g font-size=\"10\" font-weight=\"800\" fill=\"#201e1d\" text-anchor=\"middle\"><text x=\"99.7\" y=\"170\">stand₀<\/text><text x=\"218.8\" y=\"170\">t_down<\/text><text x=\"330\" y=\"170\" fill=\"#ae1800\">t_hold<\/text><text x=\"441.2\" y=\"170\">t_up<\/text><text x=\"560.3\" y=\"170\">stand₁<\/text><\/g>\n<g font-size=\"9.5\" fill=\"#605d5d\" text-anchor=\"middle\"><text x=\"99.7\" y=\"184\">0.5 s<\/text><text x=\"218.8\" y=\"184\">1.0 s<\/text><text x=\"330\" y=\"184\">0.4 s<\/text><text x=\"441.2\" y=\"184\">1.0 s<\/text><text x=\"560.3\" y=\"184\">0.5 s<\/text><\/g>\n<g font-size=\"10\" fill=\"#605d5d\"><text x=\"70\" y=\"48\">min-jerk: zero velocity and<\/text><text x=\"70\" y=\"61\">acceleration at both ends<\/text><\/g>\n<text x=\"301.4\" y=\"122\" font-size=\"10\" fill=\"#ae1800\" font-weight=\"800\">depth d = 0.20 m<\/text>\n<text x=\"606\" y=\"24\" font-size=\"9.5\" fill=\"#605d5d\">3.4 s / 20 ms<\/text><text x=\"606\" y=\"36\" font-size=\"9.5\" fill=\"#605d5d\">= N = 170<\/text>\n<\/g>\n<\/svg>\n<div class=\"eqsub\" style=\"margin-top:0\">c*_z(t) = c₀ − d · s(τ), &nbsp;s(τ) = 10τ³ − 15τ⁴ + 6τ⁵, &nbsp;τ = (t − t_start) / T_phase ∈ [0, 1] &nbsp;·&nbsp; c*_x(t) = c₀,x + com_shift_x · s(τ)<\/div>\n<figcaption>Fig. 7 — The only task signal in the squat OCP. The generator samples depth 0.10–0.30 m, descent and ascent 0.8–1.5 s, hold 0.2–0.6 s, and a fore-aft shift of ±3 cm; the bump shape is fixed. Minimum-jerk matters at the phase joints: a target with a velocity kink would ask for an impulsive CoM acceleration the torque box cannot supply, and the solver would answer with a foot-force spike.<\/figcaption>\n<\/figure>\n\n<h3>Building the problem, in pseudocode<\/h3>\n<pre><i># one node per 20 ms interval; the same recipe the paper's OCP follows, with your numbers<\/i>\ndef build_squat_problem(model, x0, com_targets, dt=0.02):\n    running = []\n    for k in range(N):\n        contacts = [Contact6D(sole_L, ref=LOCAL_WORLD_ALIGNED, baumgarte=(100, 20)),\n                    Contact6D(sole_R, ref=LOCAL_WORLD_ALIGNED, baumgarte=(100, 20))]\n        cost = Sum(\n            1e5  * CoMResidual(com_targets[k]),                    <i># <\/i><b>1<\/b>\n            1e0  * StateResidual(x_stand, weights=Q),              <i># <\/i><b>2<\/b><i>  tangent-space ⊖<\/i>\n            1e-3 * ControlResidual(),                              <i># <\/i><b>3<\/b>\n            1e5  * QuadBarrier(JointLimitResidual(margin=0.04)),   <i># <\/i><b>4<\/b>\n            1e1  * QuadBarrier(WrenchCone(sole_box, mu=0.6, fz=(20, 1000))) for each contact)  <i># <\/i><b>5<\/b>\n        dyn = ContactFwdDynamics(state, actuation, contacts, cost)  <i># solves Fig. 6 at (x, u)<\/i>\n        running.append(IntegratedEuler(dyn, dt))\n    terminal = ContactFwdDynamics(state, actuation, contacts, Sum(1e5 * CoM, 1e0 * State))  <i># <\/i><b>6<\/b>\n    problem  = ShootingProblem(x0, running, terminal)\n    solver   = BoxFDDP(problem)                       <i># u bounds from model.effortLimit — tier two<\/i>\n    solver.solve(xs_init=[x0] * (N + 1), us_init=quasistatic(x0), maxiter=200)\n    problem.calc(solver.xs, solver.us)                <i># re-evaluate: data holds the last TRIAL otherwise<\/i>\n    return solver.xs, solver.us, [d.differential.multibody.contacts.fext for d in problem.runningDatas]<\/pre>\n<div class=\"poc\">\n<div class=\"kicker\">PoC · your G1 squat<\/div>\n<p>Your node model is the same structure with the numbers exposed: hard torque box from the effort limits, and costs at <code>com&nbsp;1e5<\/code>, <code>state_reg&nbsp;1e0<\/code>, <code>joint_limits&nbsp;1e5<\/code> (barrier, 0.04&nbsp;rad inside), <code>wrench&nbsp;1e1<\/code> (friction cone μ&nbsp;0.6, CoP inside the sole box, 20&nbsp;N ≤ f_z ≤ 1&nbsp;kN), <code>control_reg&nbsp;1e-3<\/code>.<\/p>\n<p style=\"margin-bottom:0\">Your <code>com<\/code> weight is the clearest lesson in tier 3 on the page. At <code>1e4<\/code> a 1&nbsp;cm CoM error costs about the same as the regularization terms, so the solver quietly cheats: it starts descending during the standing phase, and the node-0 normal force reads 288.6&nbsp;N against a true weight of 327.1&nbsp;N. At <code>1e5<\/code> that drops to 3.9%. Nothing was \"wrong\" at 1e4 — the cost simply wasn't the priority you believed it was.<\/p>\n<\/div>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>Why can rigid contact constraints yield contact <em>forces<\/em> as a by-product, when a kinematic pose sequence cannot?<\/li>\n<li>Sort these into the three tiers: friction cone, torque limit, Newton–Euler balance, foot staying put, posture regularization.<\/li>\n<li>The contact schedule is an input. What class of behaviour does that permanently exclude from this optimizer?<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 4<\/div>\n<h2>The solver ladder: LQR → DDP → iLQR → FDDP → BoxFDDP<\/h2>\n\n<p>The paper says \"DDP\" and moves on. The name hides a four-step ladder, and knowing which rung you are on explains most solver behaviour you will observe.<\/p>\n\n<figure>\n<svg sc-camel-view-box=\"0 0 672 226\" width=\"100%\" role=\"img\" aria-label=\"Ladder from LQR to BoxFDDP with what each rung adds\">\n<g font-family=\"Archivo, sans-serif\">\n<line x1=\"0\" y1=\"2\" x2=\"672\" y2=\"2\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<g font-size=\"12.5\" font-weight=\"800\" fill=\"#201e1d\">\n<text x=\"0\" y=\"26\">LQR<\/text><text x=\"0\" y=\"66\">DDP<\/text><text x=\"0\" y=\"106\">iLQR<\/text><text x=\"0\" y=\"146\">FDDP<\/text><text x=\"0\" y=\"186\">BoxFDDP<\/text>\n<\/g>\n<g font-size=\"11\" fill=\"#201e1d\">\n<text x=\"104\" y=\"26\">Linear dynamics, quadratic cost. One backward Riccati sweep is the exact answer.<\/text>\n<text x=\"104\" y=\"66\">Iterate LQR around the current trajectory: quadratic value expansion backward, nonlinear rollout forward.<\/text>\n<text x=\"104\" y=\"106\">DDP minus the second-order dynamics derivatives (Gauss–Newton). What \"DDP\" usually means in robotics.<\/text>\n<text x=\"104\" y=\"146\">Tolerates dynamics defects — gaps between shooting nodes — so a cold start from a repeated pose works.<\/text>\n<text x=\"104\" y=\"186\" fill=\"#ae1800\">Adds a box-QP per node: hard torque limits inside the backward pass, not as a penalty.<\/text>\n<\/g>\n<g stroke=\"#d7d3d3\" stroke-width=\"1\"><path d=\"M0 38 h672 M0 78 h672 M0 118 h672 M0 158 h672\"><\/path><\/g>\n<g fill=\"#605d5d\" font-size=\"10\">\n<text x=\"0\" y=\"40\">1960s<\/text><text x=\"0\" y=\"80\">Mayne 1966<\/text><text x=\"0\" y=\"120\">Gauss–Newton<\/text><text x=\"0\" y=\"160\">Mastalli 2020<\/text><text x=\"0\" y=\"200\">Tassa 2014 · this paper, and yours<\/text>\n<\/g>\n<line x1=\"0\" y1=\"212\" x2=\"672\" y2=\"212\" stroke=\"#201e1d\" stroke-width=\"2\"><\/line>\n<\/g>\n<\/svg>\n<figcaption>Fig. 8 — Each rung adds exactly one capability. Read upward when debugging: a convergence problem is usually explained by the rung that <em>isn't<\/em> doing what you assumed.<\/figcaption>\n<\/figure>\n\n<h3>One iteration, concretely<\/h3>\n<figure>\n<svg sc-camel-view-box=\"0 0 672 150\" width=\"100%\" role=\"img\" aria-label=\"Backward pass, forward rollout, line search, convergence loop\">\n<g font-family=\"Archivo, sans-serif\">\n<g fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2\"><rect x=\"0\" y=\"26\" width=\"180\" height=\"66\"><\/rect><rect x=\"216\" y=\"26\" width=\"180\" height=\"66\"><\/rect><rect x=\"432\" y=\"26\" width=\"240\" height=\"66\"><\/rect><\/g>\n<g font-size=\"12\" font-weight=\"800\" fill=\"#201e1d\"><text x=\"12\" y=\"48\">1 · BACKWARD<\/text><text x=\"228\" y=\"48\">2 · FORWARD<\/text><text x=\"444\" y=\"48\">3 · ACCEPT?<\/text><\/g>\n<g font-size=\"10.5\" fill=\"#605d5d\">\n<text x=\"12\" y=\"66\">Linearise dynamics, quadratise<\/text><text x=\"12\" y=\"80\">cost, box-QP per node ⇒ k, K<\/text>\n<text x=\"228\" y=\"66\">Nonlinear rollout applying<\/text><text x=\"228\" y=\"80\">k + K·δx from x₀ onward<\/text>\n<text x=\"444\" y=\"66\">Cost dropped enough? No ⇒ shrink step, re-roll.<\/text><text x=\"444\" y=\"80\">Yes ⇒ gradient small? No ⇒ back to 1.<\/text>\n<\/g>\n<g stroke=\"#201e1d\" stroke-width=\"2\"><path d=\"M180 59 h26 M396 59 h26\"><\/path><\/g>\n<g fill=\"#201e1d\"><path d=\"M216 59 l-8 -4 v8 z\"><\/path><path d=\"M432 59 l-8 -4 v8 z\"><\/path><\/g>\n<path d=\"M552 92 v22 H90 v-22\" fill=\"none\" stroke=\"#201e1d\" stroke-width=\"2\" stroke-dasharray=\"5 4\"><\/path>\n<path d=\"M90 92 l-4 8 h8 z\" fill=\"#201e1d\"><\/path>\n<text x=\"0\" y=\"132\" font-size=\"10.5\" fill=\"#ae1800\" font-weight=\"800\" letter-spacing=\"0.05em\">O(N) PER ITERATION · YIELDS A LOCAL FEEDBACK LAW, NOT JUST A TRAJECTORY<\/text>\n<\/g>\n<\/svg>\n<figcaption>Fig. 9 — DDP computes local feedback gains K. Testing these gains as a teacher or controller baseline is a useful extension. Their validity depends on the nominal model and contact mode, so they do not replace learning robustness to disturbances and model mismatch; a sample-efficiency benefit remains a hypothesis.<\/figcaption>\n<\/figure>\n\n\n<h3>Inside the backward pass<\/h3>\n<p>Every rung of the ladder shares one computation: expand the action-value function Q to second order around the current (x<sub>k<\/sub>, u<sub>k<\/sub>), then minimise over the control perturbation δu in closed form.<\/p>\n<figure>\n<div class=\"eq\">\n<div class=\"eqline\" style=\"font-size:17px\">\n<span class=\"n\">1<\/span>Q<sub style=\"font-size:.6em\">x<\/sub> = ℓ<sub style=\"font-size:.6em\">x<\/sub> + F<sub style=\"font-size:.6em\">x<\/sub>ᵀ V′<sub style=\"font-size:.6em\">x<\/sub>&nbsp;&nbsp;&nbsp; Q<sub style=\"font-size:.6em\">u<\/sub> = ℓ<sub style=\"font-size:.6em\">u<\/sub> + F<sub style=\"font-size:.6em\">u<\/sub>ᵀ V′<sub style=\"font-size:.6em\">x<\/sub><br>\nQ<sub style=\"font-size:.6em\">xx<\/sub> = ℓ<sub style=\"font-size:.6em\">xx<\/sub> + F<sub style=\"font-size:.6em\">x<\/sub>ᵀ V′<sub style=\"font-size:.6em\">xx<\/sub> F<sub style=\"font-size:.6em\">x<\/sub> <span style=\"color:#a19c9c\">+ V′<sub style=\"font-size:.6em\">x<\/sub> · F<sub style=\"font-size:.6em\">xx<\/sub><\/span>&nbsp;&nbsp;&nbsp; Q<sub style=\"font-size:.6em\">uu<\/sub> = ℓ<sub style=\"font-size:.6em\">uu<\/sub> + F<sub style=\"font-size:.6em\">u<\/sub>ᵀ V′<sub style=\"font-size:.6em\">xx<\/sub> F<sub style=\"font-size:.6em\">u<\/sub> <span style=\"color:#a19c9c\">+ V′<sub style=\"font-size:.6em\">x<\/sub> · F<sub style=\"font-size:.6em\">uu<\/sub><\/span> <span class=\"n\">2<\/span><span style=\"color:#a19c9c\">+ μI<\/span>&nbsp;&nbsp;&nbsp; Q<sub style=\"font-size:.6em\">ux<\/sub> = ℓ<sub style=\"font-size:.6em\">ux<\/sub> + F<sub style=\"font-size:.6em\">u<\/sub>ᵀ V′<sub style=\"font-size:.6em\">xx<\/sub> F<sub style=\"font-size:.6em\">x<\/sub> <span style=\"color:#a19c9c\">+ V′<sub style=\"font-size:.6em\">x<\/sub> · F<sub style=\"font-size:.6em\">ux<\/sub><\/span><br>\n<span class=\"n\">3<\/span>k = −Q<sub style=\"font-size:.6em\">uu<\/sub>⁻¹ Q<sub style=\"font-size:.6em\">u<\/sub>&nbsp;&nbsp;&nbsp; <span class=\"n\">4<\/span>K = −Q<sub style=\"font-size:.6em\">uu<\/sub>⁻¹ Q<sub style=\"font-size:.6em\">ux<\/sub>&nbsp;&nbsp;&nbsp; <span class=\"n\">5<\/span>δu = k + K δx<br>\nV<sub style=\"font-size:.6em\">x<\/sub> = Q<sub style=\"font-size:.6em\">x<\/sub> − Kᵀ Q<sub style=\"font-size:.6em\">uu<\/sub> k&nbsp;&nbsp;&nbsp; V<sub style=\"font-size:.6em\">xx<\/sub> = Q<sub style=\"font-size:.6em\">xx<\/sub> − Kᵀ Q<sub style=\"font-size:.6em\">uu<\/sub> K&nbsp;&nbsp;&nbsp; <span style=\"color:#605d5d\">then step to node k−1<\/span>\n<\/div>\n<div class=\"legend\">\n<div><span class=\"n\">1<\/span><strong>Two ingredients only.<\/strong><br>Cost and dynamics derivatives enter the expansion. Full DDP includes second derivatives of dynamics; iLQR uses their first derivatives. Crocoddyl/Pinocchio provide model derivatives; the exact derivative path is implementation-dependent. V′ is the value expansion carried back from node k+1.<\/div>\n<div><span class=\"n\">2<\/span><strong>The grey terms are the ladder.<\/strong><br>Dropping all V′<sub>x<\/sub> contractions with F<sub>xx<\/sub>, F<sub>uu<\/sub> and F<sub>ux<\/sub> gives the iLQR dynamics approximation. The simplified value recursion shown assumes an unconstrained local optimum; active torque bounds require the constrained recursion. Adding μI is Levenberg–Marquardt regularisation: μ grows when a step is rejected, so stronger regularization makes the update more conservative.<\/div>\n<div><span class=\"n\">3<\/span><strong>Feedforward.<\/strong><br>The open-loop correction. In BoxFDDP this line is replaced by a box-QP: minimise ½δuᵀQ<sub>uu<\/sub>δu + Q<sub>u<\/sub>ᵀδu subject to u<sub>min<\/sub> ≤ u + δu ≤ u<sub>max<\/sub>.<\/div>\n<div><span class=\"n\">4<\/span><strong>Feedback gain.<\/strong><br>A local LQR controller around the trajectory. For controls the box-QP clamps, the corresponding rows of K are zeroed — a clamped motor cannot respond. This is what the pipeline discards.<\/div>\n<div><span class=\"n\">5<\/span><strong>The policy this defines.<\/strong><br>Applied in the forward rollout with a step length α on k only: δu = αk + Kδx. K is applied at full strength always — it is what keeps the rollout from diverging from the linearisation.<\/div>\n<\/div>\n<\/div>\n<figcaption>Fig. 10 — One node of the backward pass. The cost of the whole pass is one small linear solve per node, hence O(N). What makes it \"differential dynamic programming\" rather than a plain Gauss–Newton over all N·(nx+nu) variables is exactly this Riccati-style recursion of V′.<\/figcaption>\n<\/figure>\n\n<h3>One solve, in pseudocode<\/h3>\n<pre>def boxfddp_solve(xs, us, maxiter=200, tol=1e-9):\n    gap = [x_k1 ⊖ F(x_k, u_k) for each interval]              <i># the F: defects are allowed, and tracked<\/i>\n    for it in range(maxiter):\n        <i># 1 · backward pass<\/i>\n        Vx, Vxx = terminal.lx(xs[N]), terminal.lxx(xs[N])\n        for k in reversed(range(N)):\n            Vx = Vx + Vxx @ gap[k]                             <i># fold the defect into the value gradient<\/i>\n            Qx, Qu, Qxx, Quu, Qux = expand(node[k], xs[k], us[k], Vx, Vxx)   <i># Fig. 10 <\/i><b>1<\/b><i>, Gauss–Newton<\/i>\n            Quu = Quu + mu * I                                  <i># <\/i><b>2<\/b>\n            k_ff[k], free = boxqp(Quu, Qu, lo=u_min - us[k], hi=u_max - us[k])   <i># <\/i><b>3<\/b>\n            K_fb[k] = -solve(Quu[free, free], Qux[free]); K_fb[k][clamped] = 0   <i># <\/i><b>4<\/b>\n            Vx, Vxx = Qx - K_fb[k].T @ Quu @ k_ff[k], Qxx - K_fb[k].T @ Quu @ K_fb[k]\n        <i># 2 · forward rollout with backtracking line search<\/i>\n        for alpha in (1, .5, .25, .125, ...):\n            x_try[0] = xs[0]\n            for k in range(N):\n                u_try[k] = us[k] + alpha * k_ff[k] + K_fb[k] @ (x_try[k] ⊖ xs[k])   <i># <\/i><b>5<\/b>\n                x_try[k+1] = F(x_try[k], u_try[k]) ⊕ (1 - alpha) * gap[k]  <i># gaps close by alpha, not to zero<\/i>\n            <i># 3 · accept?<\/i>\n            if cost(x_try, u_try) &lt; cost(xs, us) - c * expected_decrease(alpha): break\n        if no alpha accepted: mu *= 10; continue                <i># trust the model less, retry<\/i>\n        xs, us, gap = x_try, u_try, (1 - alpha) * gap;  mu = max(mu / 10, mu_min)\n        if stopping_criterion(Qu) &lt; tol and max(|gap|) &lt; tol_gap: break\n    return xs, us<\/pre>\n<p style=\"font-size:12.5px;color:var(--color-neutral-700)\">FDDP can optimize state guesses with dynamics defects and close those defects during the solve. A standard shooting rollout is dynamically consistent with its controls; a repeated-pose guess alone does not imply that DDP must fail. Iteration counts do not diagnose a worse local optimum: inspect accepted costs, defects, step lengths, and termination criteria. The pseudocode is schematic, not a complete solver implementation.<\/p>\n<div class=\"poc\">\n<div class=\"kicker\">PoC · gotchas worth generalising<\/div>\n<p style=\"margin-bottom:0\"><strong>Re-evaluate accepted solutions.<\/strong> Call <code>problem.calc(xs, us)<\/code> before exporting contact data so it corresponds to the accepted trajectory. <strong>Check numerical drift.<\/strong> The recorded G1 Baumgarte sweep reported 7.24 to 1.10 mm drift across gains and adopted a 3 mm tolerance. That is a project choice, not proof that tighter accuracy is impossible: inspect integration step, convergence and model consistency. Additional iterations or a CoP violation alone do not establish a worse local optimum.<\/p>\n<\/div>\n\n<div class=\"cy\"><div class=\"kicker\" style=\"color:var(--color-text)\">Check yourself<\/div>\n<ol><li>What does the \"F\" in FDDP buy you, and what would you have to do without it?<\/li>\n<li>Why is a box-QP in the backward pass better than a quadratic penalty on torque?<\/li>\n<li>The backward pass computes feedback gains. Where do they go in this pipeline, and is that defensible?<\/li><\/ol><\/div>\n<\/section>\n\n<section>\n<div class=\"kicker\">Section 5<\/div>\n<h2>From one solve to a dataset: randomize, then prove<\/h2>\n\n<p>A single optimal trajectory can supervise training, but a diverse library broadens reference coverage. The paper generates <strong>&gt;1000 trajectories per task<\/strong>, randomizing the task parameters — gait phase, speed, foot clearance, CoM posit
